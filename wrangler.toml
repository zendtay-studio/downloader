# Cloudflare Worker for the downloader.

# `main` is the single file generated by `build.mjs`. No other module is needed
# in the deploy: the whole thing is pasted into the Cloudflare dashboard.
#
#   node tools/build.mjs            # regenerate worker.js from the sources
#   npx wrangler deploy            # publish (optional; pasting works too)
#
# No `nodejs_compat`: nothing under `src/` imports anything from Node. If it ever
# does, the optional-require flag has to come off the resolver, because in Workers
# `process` does not exist and without the flag `globalThis.process` is undefined.

name = "downloader"
main = "worker.js"
compatibility_date = "2026-09-28"

[observability]
enabled = true
