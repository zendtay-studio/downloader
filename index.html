.layout[data-view="carousel"] .player-btn svg { width: 28px; height: 28px; }

.layout[data-view="carousel"] .player-time { font-size: var(--t-body); }

/* The cover looks the same in both views: at 96 px the blur eats the detail and
   it becomes a wash of colour, which is exactly what is wanted there. */

/* In list view the audio is always a 96-132 px thumbnail: neither a waveform
   nor a time fits there, so only the play button is left, which is the only
   thing you can tap with a finger in a frame that small. The waveform and the
   rest appear when the item is opened in the window.

   It goes by view and not by a container query because a container query cannot
   style its own container: the `.media--audio` rules inside `@container audio`
   were ignored, and only those of its descendants worked. Besides, the real
   condition is the view, not the width. */
.layout[data-view="list"] .media--audio {
  aspect-ratio: 1;
  align-self: start;
  min-height: 0;
  padding: var(--s-3);
}

.layout[data-view="list"] .player { grid-template-rows: auto; }

.layout[data-view="list"] .player-track,
.layout[data-view="list"] .player-time,
.layout[data-view="list"] .player-vol { display: none; }

.layout[data-view="list"] .player-bar { justify-content: center; }
.layout[data-view="list"] .player-btn { width: 52px; height: 52px; }
.layout[data-view="list"] .player-btn svg { width: 23px; height: 23px; }

.post-foot { grid-area: foot; display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
.info { display: grid; min-width: 0; gap: 2px; }

.title {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--text-1);
}
.size { font-size: var(--t-micro); letter-spacing: .06em; text-transform: uppercase; }

/* `min-width: max-content` is not decoration: `.primary` carries
   `overflow: hidden` for the ripple effect, and that makes its `min-width: auto`
   worth 0 instead of the text's width. With `flex: 1` the button gets squashed
   below its own label and "Download" reads as "Downl". */
.post-foot .primary { flex: none; min-width: max-content; min-height: 40px; padding-inline: var(--s-3); font-size: 13px; }

/* ------------------------------------------------ 10 results window -- */
.window {
  grid-area: results;
  position: relative;
  display: flex;
  flex-direction: column;
  container-type: inline-size;
  container-name: win;
  min-width: 0;
  height: var(--win-h);
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  overflow: hidden;
  /* Background and border are in the glass rule. */
}

/* The window decides how its rows look based on the width it gets. */
@container win (max-width: 520px) {
  .post, .sk { grid-template-columns: 116px minmax(0, 1fr); }
  .post-foot { flex-wrap: wrap; }
  /* `flex: 0 0 100%` and not `width: 100%`: while the button carries `flex: 1`
     its basis becomes 0 and the requested width does not count, so instead of
     dropping to its own line it fights the text for the space. */
  .post-foot .primary { flex: 0 0 100%; }
  .sk em { display: none; }
}

@container win (max-width: 340px) {
  .post, .sk { grid-template-columns: 1fr; }
  .post { grid-template-areas: "media" "head" "foot"; }
  .sk { grid-template-areas: "media" "head"; }
  .media { aspect-ratio: 16 / 9; }
  .sk i { aspect-ratio: 16 / 9; }
}

.window-bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s-3);
  height: 46px;
  flex: none;
  padding-inline: var(--s-3);
  background: var(--card-2);
  border-bottom: 1px solid var(--line);
}

.lights { display: flex; gap: 6px; }

.light {
  width: 11px;
  height: 11px;
  background: var(--line-2);
  border-radius: 50%;
  pointer-events: none;
}

button.light {
  padding: 0;
  pointer-events: auto;
  transition: filter var(--d-1), transform var(--d-1) var(--ease);
}
button.light:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }

.light--close { background: #e0655f; pointer-events: auto; transition: filter var(--d-1) ; }

@media (hover: hover) { .light--close:hover { filter: brightness(.9); } }

.window-title {
  margin: 0;
  font-size: var(--t-sub);
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.window-meta {
  justify-self: end;
  font-size: var(--t-micro);
  min-width: 22px;
  height: 20px;
  padding-inline: 7px;
  color: var(--text-2);
  background: var(--card-3);
  border-radius: var(--r-pill);
  line-height: 20px;
  text-align: center;
}

.window-meta:empty { display: none; }

/* ── the window appears ──
   The window is not painted all at once when the results arrive: it makes a
   small gesture, with opacity and an eight-pixel shift. Without this the page
   jumped layout at the worst possible moment, which is when someone is looking
   at the button they just pressed.

   The window is animated and not each item separately, because the items already
   have their own entry and doing both at once is a compound motion that
   nauseates. The window is the frame: it comes in, and the content comes in
   inside it. */
.layout[data-state="loading"] .window,
.layout[data-state="results"] .window {
  animation: ventanaEntra var(--d-4) var(--ease-out) both;
}

@keyframes ventanaEntra {
  from { opacity: 0; transform: translateY(8px) scale(.985); }
  to   { opacity: 1; transform: none; }
}

.window-body {
  flex: 1;
  min-height: 0;
  padding: var(--s-4);
  overflow-y: auto;
  /* Same as the carousel: at the end of the list the finger carries on into the
     page instead of stopping dead against the edge. */
  scrollbar-gutter: stable;
}

.window-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-3);
  min-height: 58px;
  flex: none;
  padding: var(--s-2) var(--s-4);
  background: var(--card-2);
  border-top: 1px solid var(--line);
}


.window-foot .all { flex: none; min-height: 40px; padding-inline: var(--s-4); font-size: var(--t-sub); }

/* "Download all (12)" is the widest part of the footer: if it does not fit, the
   text shortens before pushing the switch out of the window. */
.window-foot .all span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Waiting and loading: a ghost item with the same shape as a real one, so
   nothing moves when the files arrive.

   This used to be still grey blocks, which is why it felt so heavy. Three
   things, in order of what shows most:

   1. It did not move. A still placeholder does not say "it is loading", it says
      "it has not loaded". The slow breathing is what gives the cue, and that is
      why it is on the blocks and not on the whole card: the item's background
      stays still and only the shape pulses, which is what has to be read.

   2. The fill was `--card-2`, the same token `.post:hover` and `.pcard:hover`
      use. Loading looked like a card with the pointer on it, forever. Mixed in
      halfway with `--card` it stops being the hover colour and becomes a waiting
      colour.

   3. In the carousel the skeleton takes the whole window, so `.media` stops
      being a square and becomes a slab. The low albedo moves it out of the way
      without cropping it, since cropping would move the layout when the real
      files arrive.

   The `prefers-reduced-motion` further down turns the breathing off: it goes
   back to the fixed grey, ugly but still. */
@keyframes latido {
  from { opacity: .5; }
  to   { opacity: 1; }
}

.shimmer {
  pointer-events: none;
  /* Removes only the `rise` entry from `.post`, which does not apply here: the
     skeleton must not appear all at once. The blocks inside still pulse, further
     down. */
  animation: none;
}

.shimmer .media,
.sk-avatar,
.sk-line,
.sk-btn {
  display: block;
  background: color-mix(in srgb, var(--card-2) 60%, var(--card));
  animation: latido 1600ms var(--ease) infinite alternate;
}

.sk-avatar,
.sk-line,
.sk-btn { flex: none; }

.sk-avatar { width: 24px; height: 24px; border-radius: 50%; }
.sk-line { width: var(--w, 30%); height: 11px; border-radius: var(--r-pill); }
.sk-btn { width: 104px; height: 40px; border-radius: var(--r-2); }

.shimmer .post-head .idx { display: none; }

/* In the carousel the skeleton takes the whole window, like an item. */
/* The loading skeleton has a single shape: the list one. It used to stretch to
   `height: 100%` when the view was the carousel, which made it look like an
   empty slide instead of a row loading. With the list as the default view the
   shape is the same in both, and it reads the same in one as in the other. */

.layout[data-state="results"] .shimmer { display: none; }
.layout:not([data-state="results"]) .feed { display: none; }

/* -------------------------------------------------------- 11 upload button - */
.to-top {
  position: fixed;
  right: max(20px, var(--safe-right));
  bottom: max(20px, var(--safe-bottom));
  z-index: 40;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  color: var(--text-1);
  background: var(--card);
  border: 1px solid var(--line-2);
  border-radius: 50%;
  box-shadow: var(--shadow-float);
  opacity: 0;
  visibility: hidden;
  transform: translateY(8px) scale(.94);
  pointer-events: none;
  transition: opacity var(--d-2) var(--ease), transform var(--d-2) var(--ease), visibility var(--d-2);
}

.to-top svg { width: 19px; height: 19px; }
.to-top.is-on { opacity: 1; visibility: visible; transform: none; pointer-events: auto; }

@media (hover: hover) { .to-top:hover { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); } }

/* ------------------------------------------------------------ 11 settings - */
/* A single settings block, ordered by what breaks first: width, then height, and
   the pointer last. Each step starts from the base rules, so none of them depends
   on an earlier one applying. */

@media (min-width: 1320px) {
  .post { grid-template-columns: 144px minmax(0, 1fr); }
}

@media (min-width: 1600px) {
  :root { --pad: 44px; --gap: 34px; }
  .layout { grid-template-columns: minmax(300px, 1fr) minmax(0, 600px) minmax(300px, 1fr); }
}

/* ── mobile and narrow windows ── */
@media (max-width: 720px) {
  :root {
    --pad: 20px;
    /* A phone cannot reserve 660 px of height for a box that only shows one
       video. The window is measured against the screen it has, with a ceiling
       so it does not go off the view on a small phone. */
    --win-h: clamp(240px, 58dvh, 520px);
  }

  .post { grid-template-columns: 96px minmax(0, 1fr); gap: var(--s-2) var(--s-3); }
  /* 120 and not 96: the waveform and the player together measure more than that,
     and a `min-height` below the content does not crop, it only lies. */
  .media--audio { min-height: 120px; padding: var(--s-3); }
  .hero { padding: var(--s-4); gap: var(--s-3); }
  .post-foot { flex-wrap: wrap; }
  .window-body { padding: var(--s-3); }
  .window-foot { padding-inline: var(--s-3); }

  /* With no results there is nothing to show, and an empty half-metre box only
     pushes the downloader down. It appears as soon as there is something. */
  .layout[data-state="idle"] .window { display: none; }
}

/* Below 420 px the footer no longer fits on one line: "Download all" drops below
   the switch instead of pushing it out of the window. */
@media (max-width: 420px) {
  :root { --pad: 16px; }

  .window-foot { flex-wrap: wrap; }
  .window-foot .all { order: 2; flex: 1 1 100%; }
  .hero { padding: var(--s-3); }
  .panel-keys { padding: var(--s-3); }
  .keys dt { min-width: 64px; }
  .nav { width: 32px; height: 32px; }
  .nav svg { width: 15px; height: 15px; }
}

/* Very narrow (iPhone SE and similar): only the field is tightened. The brand is
   already just the icon, so there is nothing left to trim here. */
@media (max-width: 360px) {
  .field { height: 52px; }
  .field input { font-size: 16px; }
}

/* ── short screens: phone in landscape, split window ── */
@media (max-height: 560px) {
  :root { --topbar: 58px; --s-6: 24px; }

  .hero { padding: var(--s-4); gap: var(--s-3); }
  .hero h1 { font-size: 24px; }
  .panel-keys { padding: var(--s-3); }
  .keys-row { padding: 5px 0; }
  .to-top { display: none; }
  .window { min-height: 0; }
}

/* At half height it is the decoration that gets cut, not the content: the
   shortcuts list is the first thing that can be folded away because it only
   informs. */
@media (max-height: 460px) {
  .panel-keys { display: none; }
}

/* The gap at the top goes in its own block, and not inside the "coarse pointer"
   one, for a concrete reason: that one goes last, so `--topbar` would win over
   the "short screens" block above and a phone in landscape would be left with a
   58 px bar on a 393 px screen. With `min-height` the two blocks are mutually
   exclusive and each governs its own territory.

   Only `--topbar` is touched: `--bar-pad` is inherited, so the air at the top is
   the same in both blocks. */
@media (pointer: coarse) and (min-height: 561px) {
  :root { --topbar: 70px; }
}

/* ── coarse pointer: touch targets ── */
@media (pointer: coarse) {
  /* Neither `--pad` nor `--gap` here. This block goes last, so anything it set
     would win over the `@media (min-width: 1320px)` and `(min-width: 1600px)`
     above: a 1600 px touch tablet would be left with a phone's margin. The margin
     is decided by the width blocks, which are the ones that know how much room
     there is. */

  /* With a finger the bar breathes a little more: the buttons below measure
     44-50 px and the top one was left with exactly the air it needed. */
  .layout { margin-top: 20px; }

  .theme, .paste, .clear { width: 44px; height: 44px; }
  .theme { padding-inline: 0; justify-content: center; }
  .theme .word { display: none; }
  .primary, .all { min-height: 50px; }
  .post-foot .primary { min-height: 44px; }
  .to-top {
    width: 44px;
    height: 44px;
    /* Stuck to the edge. At 50 px in the corner it mounted itself on top of the
       last item's download button, which also lives down there on the right. */
    right: max(10px, var(--safe-right));
    bottom: max(10px, var(--safe-bottom));
  }
  .view { width: 48px; }

  /* On Android the keyboard shortcuts do not exist: the panel would only take up
     height and push the downloader down. The shortcuts still exist in case a
     physical keyboard is connected. */
  .panel-keys { display: none; }

  /* The carousel arrows are hidden on touch. They sit at the vertical centre of
     the window, that is, right on top of the video, and with a 44 px zone they
     eat the finger's tap and swipe. On a touchscreen you swipe instead, so they
     get in the way more than they help. */
  /* Same selector as the carousel rule: if this were moved down to `.nav` alone,
     the one further up (more specific) would win again and the arrows would keep
     appearing under the finger. */
  .layout[data-view="carousel"] .nav { display: none; }

  /* No `touch-action: pan-x`: restricting the gesture to a single axis disables
     the other one, and with the vertical page behind it, the document scroll
     could no longer move. `auto` (the normal value) is used so the same finger
     moves the carousel or the page depending on the direction. */
  .nav, .primary, .all, .view, .light { touch-action: manipulation; }

  /* The red dot is still drawn at 11 px but is tapped at 43: a negative `inset`
     enlarges the target without changing a single pixel of the drawing. */
  button.light--close { position: relative; }

  button.light--close::after {
    content: "";
    position: absolute;
    inset: -16px;
  }

  /* The carousel arrows become finger-sized and move away from the centre so
     they do not cover the big play button. */
  .nav { width: 44px; height: 44px; }
  .nav svg { width: 20px; height: 20px; }
  .nav--prev { left: 8px; }
  .nav--next { right: 8px; }
}

/* ── surfaces inside the glass ───────────────────────────────────────────────
   It goes at the END of the sheet on purpose. These same classes have their rule
   further up —`.field`, `.detect`, `.views`— with the SAME specificity, so
   further up the sheet it would do nothing: when two selectors tie in CSS the one
   that comes later wins. Put here, it overrides them all.

   The glass is applied ONCE per panel: to whatever contains it. The divs inside
   that had an opaque background looked like flat patches stuck on top of the
   glass —the URL bar above all, which is the biggest box on the page— and that
   is exactly what breaks the impression of glass.

   There is no new `backdrop-filter` here, and that is the important part: the
   parent's blur already reaches the children, which paint on top of it. One
   filter per level would blur the same background twice —blurred and dirty— and
   would multiply the GPU cost without adding anything.

   What changes is the colour: the ones that were inside move to `--cristal-item`,
   the same token `.post` uses inside `.window`. It is an alpha a little above the
   panel's, so they read as a slightly more raised surface without stopping the
   background from showing through.

   Only ONE level of depth. The grandchildren —the paste button, the avatar, the
   type icons, the download button— stay opaque on purpose: they are the content,
   and what has to keep its contrast against the shifting background is precisely
   them. Translucent on top of translucent turns to mud. */
.field,
.detect,
.views,
.window-bar,
.window-foot,
.media {
  background: var(--cristal-item);
}

/* The platform cards, with the same treatment: translucent and with the edge that
   makes them glass, but without a filter of their own. */
.pcard {
  background: var(--cristal-item);
  border-color: var(--cristal-borde);
  box-shadow:
    inset 0 1px 0 var(--cristal-luz),
    0 1px 2px var(--cristal-sombra);
}

/* The two nested filters that were left. The carousel buttons and the loading
   skeleton are already inside `.window`, which is the one carrying the filter:
   Encode blurs the same background a second time, and on top of that the
   skeleton only exists while loading. */
.nav,
.post.shimmer {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* Their hover stays theirs, which is more opaque: you notice it when you pass
   over. */
.field:hover,
.views:hover {
  background: var(--cristal-hover);
}

:root[data-boot] .post { animation: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<!-- ── background video ──

     `body::before`), with no controls and no sound.

     The URL is ABSOLUTE on purpose. The Worker serves the page from its own
     origin, so a relative `src` would end up requesting a path on the Worker's
     own host, which is not one it knows: 404. The file itself lives on Pexels'
     CDN, not in the repository, so there is nothing to upload.

     `muted` in the attribute is what lets the autoplay through —with sound
     browsers block it— and `playsinline` is what stops it going full screen on
     iOS. `disablepictureinpicture` removes the "view in a separate window"
     button Safari adds even without `controls`.

     `crossorigin` is not for the video, which looks the same without it: it is
     so the video can be drawn to a canvas and its pixels read, which is what
     lets the bar's text know whether there is light behind it. Without this
     header the canvas is tainted for security and reading pixels throws.

     Pexels sends `access-control-allow-origin: *`, which is what makes it
     work. If a video from a site that does not send it were ever used, the
     video would look the same but the bar's ink would stay the theme's. -->
<video class="backdrop" id="backdrop" muted loop autoplay playsinline preload="auto"

https://videos.pexels.com/video-files/15445355/15445355-sd_640_360_25fps.mp4

/* ---------------------------------------------------------------- refs -- */

const form      = document.querySelector("#form");
const field     = document.querySelector("#field");

const clearBtn  = document.querySelector("#clear");

const allLbl    = document.querySelector("#allLabel");

const railDown  = document.querySelector("#railDown");

const viewNext  = document.querySelector("#viewNext");

/* ── background video ──
   `muted` is already in the HTML, which is what lets the autoplay through: with
   sound browsers block it. It is repeated here as a property because some
   browsers forget the attribute on the first playback and only respect it from
   the second one onwards. */
const background = document.getElementById("backdrop");

if (background) {
  background.muted = true;

  /* Under `prefers-reduced-motion` it stops and stays on the first frame. A
     video moving behind all the content is one of the few things that
     preference exists to remove, so it stops here and not in the stylesheet:
     the `animation-duration: .01ms` below does not stop a `<video>`, which is
     not a CSS animation. */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) background.pause();

  /* If the file does not arrive —it is not uploaded to the repository, or the
     browser has no H.264— the element paints nothing, so the page looks just as
     good. It is removed from the document anyway: an empty `<video>` still
     occupies a composited layer, and with `filter` and `transform` set the
     browser keeps decoding the frame on every step even when there is nothing
     to show. Removing the element gives that work back to the GPU.

     A `<source>`'s `error` does not bubble up to the `<video>`, so both have
     to be listened to or the failure goes unnoticed. */
  const sinVideo = () => background.remove();

  background.addEventListener("error", sinVideo, { once: true });

  for (const source of background.querySelectorAll("source")) {
    source.addEventListener("error", sinVideo, { once: true });

}

/* ── bar ink according to what is behind it ───────────────────────
   The bar has no background, so its icons and its text have to know whether
   there is light behind them or not. With the light theme the ink is always
   dark, and if the video has a bright stretch right behind the bar, the
   text is lost.

   It is measured for real instead of decided by the theme: the frame is
   drawn small on a canvas and the strip at the top is read, which is the
   part that sits under the bar. It is little work —32 by 18 pixels— and
   it is done four times a second, not on every frame. At that scale the eye
   cannot tell a change apart before that, and asking for it on every step
   would be wasted work.

   The video is drawn small on purpose: dumping a whole 4K frame onto a
   canvas four times a second costs much more than reading a thumbnail. */
const INK = {
  video: background,
  ctx: null,
  /** Thumbnail size. 32 wide is enough to decide, and the height is
      cropped to 18 because only four rows are read. */
  width: 32,
  height: 18,
  /** How many rows from the top are looked at: the bar, plus a little
      extra in case the video changes framing. */
  rows: 4,
  /** Smoothed luminance, between 0 and 1. */
  average: null,
  reloj: 0,
  /* How often it is measured. It was 250 and it was not the bottleneck: the
     measurement itself costs 0.012 ms, measured against the real video, so at
     120 ms the whole loop costs 0.1 ms per second and the delay the eye saw was
     never the sampling but the smoothing. 120 is 8 a second, and below that
     there is nothing to see: the eye cannot tell two changes 60 ms apart. */
  cada: 120,
};

/* The smoothing weights, and the two dead zones. The numbers are not arbitrary
   and the reasoning is in `measureInk()`: a big change is chased fast and only
   has to clear a narrow margin, a small one is eased into and has to clear a
   wide one. With a single value for both, a cut took 6.25 s to be believed and a
   slow pan was never believed at all. */
const PESO_BRUSCO = 0.5;
const PESO_SUAVE = 0.18;
const MARGEN_BRUSCO = 0.04;
const MARGEN_SUAVE = 0.09;
const UMBRAL_BRUSCO = 0.055;

/** Perceptual luminance of the top strip, between 0 and 1. */
function stripLuminance() {
  const { ctx, width, rows } = INK;

  ctx.drawImage(INK.video, 0, 0, width, INK.height);

  const d = ctx.getImageData(0, 0, width, rows).data;

  let suma = 0;

  for (let i = 0; i < d.length; i += 4) {
    suma += 0.2126 * (d[i] / 255) + 0.7152 * (d[i + 1] / 255) + 0.0722 * (d[i + 2] / 255);
  }

  return suma / (d.length / 4);
}

function measureInk() {
  const ahora = performance.now();

  if (ahora - INK.reloj < INK.cada) return;

  INK.reloj = ahora;

  /* Without `videoWidth` the video has not given a single frame yet, and
     the canvas comes out black. Deciding on that would give light ink
     over a page that has not painted anything yet. */
  if (!INK.video?.videoWidth) return;

  /* With the video off there is nothing to measure, and whatever stayed frozen
     from the last reading would be the wrong decision: the bar would go back to
     the theme's ink on switch-off, and if the meter kept running it would change
     it again off a frame that is no longer on screen. */
  if (INK.video.hidden) return;

  let average;

  try {
    average = stripLuminance();
  } catch {
    /* It jumps if the canvas is tainted, which is what happens with a video
      that sends no CORS headers. The video is still visible; what is
      abandoned is only the adaptive ink, and the bar keeps the theme's. */
    INK.ctx = null;
    return;
  }

  /* Smoothing. Without this the bar would change ink on every frame of the
    video, and that reads as flickering, not as adapting. With this weight
    it takes a few seconds to follow a big change, which is exactly what is
    wanted: the bar must not flip because the video has a flash. */
  /* What is measured is the RAW frame, and what sits behind the bar is the
    frame with the theme's veil on top. Without this blend the decision is
    made on an image nobody sees, and in the light theme the cream veil
    lightened it enough for the ink to come out backwards: the video
    measures 0.457 and with the veil it is clearly on the light side, which
    is where the dark ink goes.

    The veil is composed here as a normal alpha, which is what it is. The
    halo of `body::before` is not composed: it is a very soft gradient that
    in the light theme pushes up even further, that is, towards the same
    decision already made, and in the dark theme it does almost nothing. */
  const veil = getComputedStyle(root).getPropertyValue("--veil").trim().match(
    /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,/]\s*([\d.]+))?/);

  if (veil) {

    const grey = (Number(veil[1]) * 0.2126 + Number(veil[2]) * 0.7152 + Number(veil[3]) * 0.0722) / 255;
    average = average * (1 - alpha) + grey * alpha;
  }

  /* The mean and the margin are chosen according to how big the change is, and
     not always the same way. With a single weight the bar took six seconds to
     follow a scene cut and never followed a slow pan: measured, with the old
     algorithm, a change from 0.78 to 0.22 took 6250 ms to be decided on and a
     four-second pan went unchanged. What is wanted is not a "good" mean, it is
     for a cut to show up instantly and for a slow change not to flicker, and
     those are two different things.

     A high weight eats the flicker just the same, because the jump is only
     detected once it has happened: the smoothing is still there, and it only
     speeds up when the measured value has really moved. A one-frame flash
     measures as a jump and would speed up, but it lasts one frame and the
     smoothing eats it just as fast: the condition that avoids the flicker is
     that the mean value changes sides, and that is what the margin is for. */

  const delta = Math.abs(average - (INK.average ?? average));
  const sharp = delta > UMBRAL_BRUSCO;

  INK.average = INK.average === null
    ? average
    : INK.average + (average - INK.average) * (sharp ? PESO_BRUSCO : PESO_SUAVE);

  /* Mind how it is read: `dataset` returns `undefined` when the
    attribute is absent, and not `null` as `getAttribute` does.
    Comparing against `null` meant the first decision —the one that
    decides whether adaptive ink is ever used— never ran and the bar
    kept the theme's without it. */
  const actual = root.getAttribute("data-ink");

  /* The FIRST time it is always decided, even if the value falls in the
    middle. With a dead zone here the bar stayed undecided with the
    background video the page itself ships —which measures 0.457, right in
    the centre— and the adaptation never worked. In the centre it does not
    matter which ink is chosen: both give a similar contrast, so the one
    on the nearer side is chosen.

    The dead zone stays for CHANGING, and it is wide on purpose: that is what
    stops a slow pan from flickering when it passes through the middle. A cut
    gets a much narrower one, because a cut that waits for a wide margin is a cut
    that arrives when the scene has already moved on. */
  if (actual === null) {
    root.dataset.ink = INK.average < 0.5 ? "light" : "dark";
    return;
  }

  const margin = sharp ? MARGEN_BRUSCO : MARGEN_SUAVE;

  if (INK.average < 0.5 - margin && actual === "dark") root.dataset.ink = "light";
  else if (INK.average > 0.5 + margin && actual === "light") root.dataset.ink = "dark";
}

{
  const canvas = document.createElement("canvas");

  canvas.width = INK.width;
  canvas.height = INK.height;

  INK.ctx = canvas.getContext("2d", { willReadFrequently: true });

  if (INK.ctx) {
        /* It waits a little before the first measurement: the video takes a
           while to give its first frame and the decision has to be made on a
           real one, not on the canvas's black. */
    setTimeout(() => {
      measureInk();
      setInterval(measureInk, INK.cada);
    }, 600);

        /* On changing video the running average is forgotten: the new image
           can be completely different in brightness, and with the old value
           the bar would take several seconds to get it right. */
    background?.addEventListener("loadeddata", () => {
      INK.average = null;
      delete root.dataset.ink;
    });
  }

/* ── the background's dot field ────────────────────────────────────────────
   A grid of dots that moves aside when the pointer goes over and slowly comes
   back. The background reacts; nothing follows the pointer.

   It is a `<canvas>` for one very concrete reason: it needs on the order of a
   thousand dots, and a thousand DOM elements moving on every frame eat the
   whole page. With what already moves here —the eighty-four card marquee, four
   panels with `backdrop-filter` and the video— that is the difference between
   the page responding and the page lagging.

   And the loop stops once the field is back in place. With the pointer still
   there is no frame requested at all, which is where the battery really shows. */
/* The field's lengths are design lengths in CSS pixels, and only are they that
   while the zoom is at 100% or above. Zoom out and one CSS pixel is a fraction of
   a physical pixel: at 25% a dot of radius 1.15 draws a smudge of radius 0.29,
   which never covers a whole pixel, and seventeen thousand of them eight and a
   half pixels apart weave a grey cloth over the page instead of reading as
   points. That is measured, not guessed — `tools/check-zoom.mjs` fails if any of
   these end up under a physical pixel.

   `measureField` divides them down to CSS pixels once it knows the zoom, and that
   division is the identity at 100% and above. So a normal screen is untouched
   and only the zoom that was breaking it changes. */
const PASO = 34;
const RADIO = 1.15;
const EMPUJE = 22;
const ALCANCE = 150;
const ENGORDE = 0.5;

  canvas: document.getElementById("campo"),
  ctx: null,
  puntos: [],
  /** Grid spacing, in CSS pixels. A design length until `measureField` scales it. */
  paso: PASO,
  radio: RADIO,
  /** Points nearly invisible at rest, and in what colour. */
  calma: 0.07,
  /** Around the pointer they become visible and are pushed away. */
  vida: 0.4,
  /** How far a point right under the pointer moves away. */
  empuje: EMPUJE,
  /** Radius of action, in CSS pixels. */
  alcance: ALCANCE,
  /** How much bigger a point gets under the pointer. A design length too. */
  engorde: ENGORDE,
  x: -9999,
  y: -9999,
    /** Last pointer position, to know whether the field has settled. */
  quieto: true,
  color: "0, 0, 0",
  frame: -1,
  dpr: 1,
};

  const { ctx, puntos } = FIELD;

  if (!ctx || !puntos.length) return;

    /* The canvas is cleared in DEVICE pixels, with the transform taken off first.
       `clearRect` goes through the same transform as everything else drawn here,
       so handing it the backing store's own width and height does not clear the
       backing store: at 25% zoom the context is scaled by a quarter, so those
       numbers cleared a sixteenth of the canvas and left the other fifteen
       sixteenths holding the frame before.

       Which is what the field looked like zoomed out: every point drew itself over
       where it had just been, so instead of a point there was the little arc it
       had swept, and those arcs overlapped until the right-hand side of the screen
       was full of commas. Measured at that zoom, 94% of the canvas was never
       cleared at all.

       At 100% and above the mistake could not be seen — the scale is one or more,
       so the rectangle was already larger than the canvas and the over-clear is
       harmless — which is exactly why it only ever showed up zoomed out. */
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, FIELD.canvas.width, FIELD.canvas.height);
  ctx.restore();

  let enCalma = true;

  for (const punto of puntos) {
    const dx = FIELD.x - punto.x;
    const dy = FIELD.y - punto.y;
    const distancia = Math.hypot(dx, dy);

        /* How much it affects the point: one at the tip of the pointer, zero
           outside the reach. Squaring the factor is what keeps the effect
           inside a circle instead of ending with a straight edge, which is
           what you get when you compute a distance and clip it. */
    const cerca = distancia < FIELD.alcance ? 1 - distancia / FIELD.alcance : 0;
    const fuerza = cerca * cerca;

    if (fuerza > 0.002) {
            /* The point moves away in the direction opposite the pointer. The
               distance is divided by its own value so as not to start from zero
               when the pointer lands right on the point —there the direction is
               undefined and a `NaN` came out that swallowed the whole point—. */
      const largo = distancia || 1;

      punto.dx = -(dx / largo) * FIELD.empuje * fuerza;
      punto.dy = -(dy / largo) * FIELD.empuje * fuerza;
    } else {
      punto.dx = 0;
      punto.dy = 0;
    }

        /* The displacement is chased, not set: that way the point moves away
           all at once and then comes back along a curve, which is what makes
           the push read as a push instead of a jump. */
    punto.mx += (punto.dx - punto.mx) * 0.16;
    punto.my += (punto.dy - punto.my) * 0.16;

    if (Math.abs(punto.dx - punto.mx) > 0.05 || Math.abs(punto.dy - punto.my) > 0.05) enCalma = false;

    ctx.beginPath();
    ctx.fillStyle = `rgba(${FIELD.color}, ${(FIELD.calma + fuerza * FIELD.vida).toFixed(3)})`;
    ctx.arc(punto.x + punto.mx, punto.y + punto.my, FIELD.radio + fuerza * FIELD.engorde, 0, Math.PI * 2);
    ctx.fill();
  }

  FIELD.quieto = enCalma;
}

function fieldStep() {
  paintField();

    /* It stops once the displacements have arrived. The margin is five
       hundredths of a pixel, which is below what can be seen. */
  FIELD.frame = FIELD.quieto ? -1 : requestAnimationFrame(fieldStep);
}

function measureField() {
  const { canvas, ctx } = FIELD;
  const width = window.innerWidth;
  const height = window.innerHeight;

    /* The canvas is measured in screen pixels and painted at double on
       high-density screens. Without this the points come out the size of a
       hair on a laptop and look square; and with `dpr` uncapped, on a 3x
       screen the work is multiplied by nine for nothing. */
  FIELD.dpr = Math.min(window.devicePixelRatio || 1, 2);

    /* Below one — which is what zooming out gives — a CSS pixel is smaller than
       a physical pixel, and the design lengths have to grow to keep the field
       the size it is on the screen. Capped at one, so at 25% zoom the spacing
       becomes 136 CSS pixels and the dots 4.6, which is 34 and 1.15 real ones,
       and the field is a thousand points instead of seventeen thousand.

       Capped rather than inverted: on a 2x screen the zoom raises `dpr`, not
       lowers it, and 34 CSS pixels there is comfortably large already. */
  const escala = 1 / Math.min(FIELD.dpr, 1);

  FIELD.paso = PASO * escala;
  FIELD.radio = RADIO * escala;
  FIELD.empuje = EMPUJE * escala;
  FIELD.alcance = ALCANCE * escala;
  FIELD.engorde = ENGORDE * escala;

  canvas.width = Math.round(width * FIELD.dpr);
  canvas.height = Math.round(height * FIELD.dpr);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;

  ctx.setTransform(FIELD.dpr, 0, 0, FIELD.dpr, 0, 0);

    /* The grid is offset by half a cell so it does not land exactly on the
       screen edges, where it would read as a frame and not as a field. */
  const puntos = [];

  for (let y = FIELD.paso / 2; y < height + FIELD.paso; y += FIELD.paso) {
    for (let x = FIELD.paso / 2; x < width + FIELD.paso; x += FIELD.paso) {
      puntos.push({ x, y, dx: 0, dy: 0, mx: 0, my: 0 });
    }
  }

  FIELD.puntos = puntos;
}

/** The colour of the points is read from the theme, so two of them do not have to
      be hardcoded. */
function fieldColor() {
  /* `--text-1` is a hex colour, `#201c17` in light and `#f2ede4` in dark. It was
     read with `match(/[\d.]+/g)`, which finds digit runs and nothing else, so
     `#201c17` came back as `["201", "17"]`: two numbers, not three, the
     `length >= 3` below was never true, and `FIELD.color` stayed at its initial
     `"0, 0, 0"` forever. The dots were painted black in both themes — invisible on
     the dark one — and the MutationObserver that is supposed to repaint them on a
     theme change was repainting the same black.

     Hex is read as hex. `rgb()` is still accepted because `--veil` is written in
     that form and the other half of this reads it. */
  const value = getComputedStyle(root).getPropertyValue("--text-1").trim();

  if (value.startsWith("#")) {
    const hex = value.slice(1);

    if (hex.length === 3) {
      FIELD.color = [...hex].map((c) => parseInt(c + c, 16)).join(", ");
      return;
    }

    if (hex.length >= 6) {
      FIELD.color = [0, 2, 4].map((at) => parseInt(hex.slice(at, at + 2), 16)).join(", ");
      return;
    }
  }

  const numbers = (value.match(/[\d.]+/g) ?? []).map(Number);

  if (numbers.length >= 3) FIELD.color = `${numbers[0]}, ${numbers[1]}, ${numbers[2]}`;
}

{
  const { canvas } = FIELD;
  const noSirve = matchMedia("(pointer: coarse), (prefers-reduced-motion: reduce)");

  if (canvas && !noSirve.matches) {
    FIELD.ctx = canvas.getContext("2d");

    if (FIELD.ctx) {
      fieldColor();
      measureField();
      paintField();

      addEventListener("pointermove", (evento) => {
        if (evento.pointerType && evento.pointerType !== "mouse") return;

        FIELD.x = evento.clientX;
        FIELD.y = evento.clientY;

        if (FIELD.frame < 0) FIELD.frame = requestAnimationFrame(fieldStep);
      }, { passive: true });

            /* On leaving the window the pointer is gone: the field returns to
               its place instead of staying pushed towards an edge that does not
               exist. */
      document.addEventListener("pointerleave", () => {
        FIELD.x = -9999;
        FIELD.y = -9999;

        if (FIELD.frame < 0) FIELD.frame = requestAnimationFrame(fieldStep);
      });

            /* The window changes size: the grid is rebuilt, and while that happens
               it is left unpainted until the next frame, so it is repainted right
               away. */
      let alCambiar = 0;

      addEventListener("resize", () => {
        clearTimeout(alCambiar);
        alCambiar = setTimeout(() => {
          fieldColor();
          measureField();
          paintField();
        }, 120);
      }, { passive: true });

            /* On changing theme the text colour changes, and so do the points. */
      new MutationObserver(fieldColor).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

      noSirve.addEventListener("change", () => canvas.remove());
    }
  } else {
    canvas?.remove();
  }
}

/* ── choosing the background video ──────────────────────────────
   The list lives in `video.json`, in the repository, so backgrounds can be
   added without touching this page: edit the JSON and it shows up in the
   next deploy.

   The ID alone is NOT enough to build the URL. Pexels has this shape:

       videos.pexels.com/video-files/28295446/12353430_640_360_60fps.mp4
                                        └── id ──┘ └──── name ────────┘

   and the name changes on every video —`12353430_640_360_60fps` on one,
   `28295446-hd_1920_1080_30fps` on another— so the JSON stores both halves
   and here they are only joined with the base. All fourteen were checked to
   answer 200.

   "Auto" picks one on each load, which is what makes two visits not look
   the same. If someone picks a fixed one, it is stored and takes precedence
   over the draw until they change or clear it. */
const BACKGROUNDS_URL = "https://raw.githubusercontent.com/zendtay-studio/downloader/gh-pages/video.json";

/* The key this page stores the chosen background under, and the one it used to
   store it under. Renaming a localStorage key looks like a rename and is not one:
   the value lives in the visitor's browser, so the new name comes up empty and the
   background they picked silently reverts to "auto". The old key is read once,
   copied across and removed, and `saveBackground` clears both on purpose — someone
   who has switched the background off must not have it come back on the next visit
   just because the migration ran again. */
const BACKGROUND_KEY = "downloader-background";
const BACKGROUND_KEY_ANTES = "downloader-fondo";

const backgrounds = {
  list: [],
    /**
     * Three states and not one: "auto" draws one on each load, "off" switches the
     * video off, and a number is a fixed entry from the list.
     *
     * Before, "auto" was `null` and there was no way to switch it off: choosing
     * always ended up being watching a video. For whoever has a headache, with the
     * phone in their hand and no connection, or simply does not want anything
     * moving behind, that third option is needed, and it goes first because it is
     * the one you are looking for when you are looking.
     */
  chosen: null,
};

/** The whole URL of a video, from the base and the two halves in the JSON. */
function backgroundUrl(video, base) {
  return `${base.replace(/\/$/, "")}/${video.id}/${video.file}`;
}

/**
 * Changes the background video.
 *
 * The element is not removed and a new one put in: the `src` of the same
 * `<video>` is changed, which is what stops the browser from throwing away the
 * composited layer and asking for the first frame all over again. It waits until
 * there is data before making it visible, or you see a jump to black while it
 * downloads.
 */
function setBackground(eq) {
  if (!background || !backgrounds.list.length) return;

  const video = backgrounds.list[eq];

  if (!video) return;

  const url = backgroundUrl(video, backgrounds.base);

  if (background.dataset.url === url) return;

  background.dataset.url = url;
  background.hidden = false;
  background.style.opacity = "0";
  background.src = url;

  background.addEventListener(
    "loadeddata",
    () => {
      background.style.opacity = "";
      background.play?.().catch(() => {});
    },
    { once: true },
  );
}

/**
 * Switches the video off without removing it from the document.
 *
 * It hides instead of removing itself, because removing it fires `<source>`'s
 * `error`, which deletes it for good, and switching it back on would then force
 * the whole element to be rebuilt. Hidden and paused, it can be switched back on
 * in one line.
 *
 * The `src` is left in place on purpose. It could be emptied to save bandwidth,
 * but emptying it fires `load()` with no source, which is an `error`, and that is
 * exactly the path that deletes it. The cost is a video that is already in the
 * browser's cache and is not being played, which is the lesser of the two things.
 *
 * And `data-ink` is cleared with it: with no video behind, the bar has to go back
 * to the theme's ink, because the meter has nothing left to look at and whatever
 * it decided would stay frozen on the last reading.
 */
function stopBackground() {
  if (!background) return;

  background.pause();
  background.hidden = true;
  delete background.dataset.url;
  delete root.dataset.ink;
}

/** Whatever is stored, validated against the list: an expired index is worth
      nothing. */
function storedBackground() {
  try {
    const actual = localStorage.getItem(BACKGROUND_KEY);

    if (actual !== null) return actual;

    /* Nothing under the new name. If something is under the old one, it is
       somebody's choice made before the rename, so it moves across rather than
       being treated as no choice at all. */
    const antes = localStorage.getItem(BACKGROUND_KEY_ANTES);

    if (antes === null) return null;

    localStorage.setItem(BACKGROUND_KEY, antes);
    localStorage.removeItem(BACKGROUND_KEY_ANTES);

    return antes;
  } catch {
    return null;
  }
}

function saveBackground(average) {
  try {
    /* Both names, deliberately. Clearing the new key and leaving the old one
       behind would let the migration above hand back a preference that has just
       been switched off, on the very next page load. */
    localStorage.removeItem(BACKGROUND_KEY_ANTES);

    if (average === null) localStorage.removeItem(BACKGROUND_KEY);
    else localStorage.setItem(BACKGROUND_KEY, String(average));
  } catch {}
}

async function loadBackgroundList() {
  /* Two places are tried and it keeps the first one that answers. The same
     origin goes first because it is the only one of the two that exists while
     working locally; in production it 404s —the Worker does not serve static
     files except the preview image— and the repository's list has to be reached.
     The other way round would work just as well, but locally you would be waiting
     for a GitHub 404 on every load for no reason.

     If neither answers, the video that already came in the HTML stays and the
     button hides. The page looks the same without the picker, so it is not worth
     anything more. */
  for (const url of [`${location.origin}/video.json`, BACKGROUNDS_URL]) {
    try {
      const response = await fetch(url, { cache: "no-cache" });

      if (!response.ok) continue;

      const datos = await response.json();

      if (!Array.isArray(datos.videos) || !datos.videos.length) continue;

      backgrounds.base = datos.base ?? "";
      backgrounds.list = datos.videos.filter((v) => v && v.id && v.file);
      backgrounds.list.forEach((v, i) => { v.indice = i; });

      if (backgrounds.list.length) return;
    } catch {}
  }
}

/* How wide the file claims to be, read off its own name.
 *
 * Pexels puts the resolution in the filename and it always matches the stream:
 * `12353430_640_360_60fps.mp4` is 640x360, `28295446-hd_1920_1080_30fps.mp4` is
 * 1920x1080. Three of the fourteen are 640x360, which stretched across a
 * full-screen background is a two-and-a-half-times upscale: the footage goes
 * soft and the compression blocks come up as mottling, which is what the dots
 * were. Zooming out shows more of it, which is why it looked like a zoom bug.
 *
 * They stay in the list rather than being dropped, because the list is indexed
 * and the chosen theme is stored as an index — dropping three would renumber the
 * other eleven and hand somebody who saved "Theme 7" a different video. So they
 * are kept, they are never picked at random, and the menu says which they are. */
const MIN_ANCHO = 1280;

function anchoDe(v) {
  /* The name separates the numbers with underscores, not with an x:
     `12353430_640_360_60fps.mp4` and `12883200-hd_1280_720_30fps.mp4`. The first
     attempt at this read `x` and matched nothing, which made every entry look
     like zero pixels wide — so all fourteen were treated as too small, the filter
     passed nothing, and the fallback drew from the whole list anyway. A filter
     that matches nothing and a filter that is switched off look the same from
     the outside. The `x` form is still accepted because Pexels is not
     consistent about it. */
  const formas = [
    /[_-](\d{3,4})[x_](\d{3,4})[_-]\d+fps/i,   // 12353430_640_360_60fps
    /[_-](\d{3,4})x(\d{3,4})[_-]/i,            // 12883200-hd_1280x720
    /(\d{3,4})\s*x\s*(\d{3,4})/,               // 3840x2160
  ];

  for (const forma of formas) {
    const encontrado = forma.exec(v.file);

    if (encontrado) {
      const ancho = Number(encontrado[1]);

      if (Number.isFinite(ancho) && ancho > 0) return ancho;
    }
  }

  /* Nothing measured is not a licence to put it on screen, so unknown reads as
     too small rather than as good enough. */
  return 0;
}

function esBajaResolucion(v) {
  return anchoDe(v) < MIN_ANCHO;
}

/** The entries worth picking at random: everything big enough to fill a screen. */
function candidatos() {
  return backgrounds.list.filter((v) => !esBajaResolucion(v));
}

/* The popover. It is built after having the list, so that it only exists if there
   is something to choose —if the JSON fails, the button hides instead of opening an
   empty panel. */
const themeButton = document.getElementById("themeButton");
const themeMenu = document.getElementById("themeMenu");
const themeLabel = document.getElementById("themeLabel");
let themeFade = null;

function backgroundName(average) {
  if (average === "off") return "Off";
  return average === null ? "Auto" : `Theme ${average + 1}`;
}

function markMenu() {
  if (!themeMenu) return;

  for (const item of themeMenu.querySelectorAll(".background-option")) {
    const average = item.dataset.average;

    item.setAttribute("aria-checked", String(backgroundForValue(average) === backgrounds.chosen));
  }
}

function backgroundForValue(average) {
  if (average === "auto") return null;
  if (average === "off") return "off";

  return Number(average);
}

function openMenu(abrir) {
  if (!themeMenu) return;

  const dentro = Boolean(abrir);

  themeMenu.hidden = !dentro;
  themeButton.setAttribute("aria-expanded", String(dentro));

  if (dentro) {
    markMenu();

    /* The veil hangs from `.backgroundLayer`, which is the panel's parent, and NOT from
    `body`.

       The top bar is `position: sticky` with `z-index: 30`, and that creates a
       stacking context: the panel's `z-index: 40` counts inside that context,
       not at the root. With the veil in `body` and its 39, the whole topbar —and
       the panel with it— ends up underneath, and the veil swallows every click:
       the menu looked perfect and nothing could be chosen. Checked with
       `elementFromPoint`, which returned the veil for the first four items.

       In the same parent, the two are compared in the same context and the 40
       wins. */
    themeFade = document.createElement("div");
    themeFade.className = "theme-veil";
    themeFade.addEventListener("click", () => openMenu(false));
    themeButton.parentElement.append(themeFade);
  } else {
    themeFade?.remove();
    themeFade = null;
  }
}

function chooseBackground(average) {
  backgrounds.chosen = backgroundForValue(average);
  saveBackground(backgrounds.chosen);
  themeLabel.textContent = backgroundName(backgrounds.chosen);

  if (backgrounds.chosen === "off") {
    stopBackground();
  } else if (backgrounds.chosen === null) {
    // Auto: one at random. No replacement, because with fourteen videos it does
    // not matter either, but that way two reloads in a row can give the same.
    const candidatos = candidatos();
    setBackground(candidatos.length
      ? candidatos[Math.floor(Math.random() * candidatos.length)].indice
      : Math.floor(Math.random() * backgrounds.list.length));
  } else {
    setBackground(backgrounds.chosen);
  }

  openMenu(false);
  markMenu();
}

function buildMenu() {
  if (!themeMenu || !themeButton) return;

  themeMenu.replaceChildren();

  /* Auto and Off go first, and Auto the very first because it is what is set by
     default. The order is the one the keyboard walks through, so putting "Off"
     second leaves it one key away from the one used daily. */
  const options = [["auto", "Auto"], ["off", "Off"]];

  for (const v of backgrounds.list) {
    /* The number is the index and stays the index, and every background keeps its
       row. Both matter for the same reason: a saved theme is stored as an index, so
       dropping the three that are too small to fill a screen would hand everybody
       who had picked one a different video without telling them. They are listed
       and they can be chosen; they are simply never picked at random, which is
       what `candidatos()` does.

       Nothing in the label says which is which. There was a ` · 640px` here for a
       while, and it went: fourteen rows reading `Theme 4`, `Theme 12 · 640px` is a
       worse list than fourteen rows that all look the same, because the note drew
       the eye to a difference the eye cannot act on. A theme is picked by eye, and
       there is nothing to see here but a number — so the number is all it says. */
    options.push([String(v.indice), `Theme ${v.indice + 1}`]);
  }

  for (const [average, text] of options) {
    const item = document.createElement("button");
    const check = document.createElementNS("http://www.w3.org/2000/svg", "svg");

    item.type = "button";
    item.className = "background-option";
    item.dataset.average = average;
    item.setAttribute("role", "menuitemradio");
    item.setAttribute("aria-checked", "false");

    check.setAttribute("class", "i-check");
    check.setAttribute("viewBox", "0 0 24 24");
    check.setAttribute("fill", "none");
    check.setAttribute("stroke", "currentColor");
    check.setAttribute("stroke-width", "2.4");
    check.setAttribute("stroke-linecap", "round");
    check.setAttribute("stroke-linejoin", "round");
    check.setAttribute("aria-hidden", "true");
    check.innerHTML = '<path d="m5 12.5 4.5 4.5L19 7"/>';

    const label = document.createElement("span");
    label.textContent = text;

    item.append(check, label);
    themeMenu.append(item);
  }

  themeButton.addEventListener("click", () => openMenu(themeMenu.hidden));

  themeMenu.addEventListener("click", (evento) => {
    const item = evento.target.closest(".background-option");

    if (item) chooseBackground(item.dataset.average);
  });

  // Closing with Escape is what anyone using the keyboard expects, and with the
  // focus handed back to the button so you do not lose your place.
  document.addEventListener("keydown", (evento) => {
    if (evento.key !== "Escape" || themeMenu.hidden) return;

    openMenu(false);
    themeButton.focus();
  });

  openMenu(false);

  /* The item that is set is marked when the menu is built, not only when it is
     opened. Before it was marked in `openMenu(true)` and in `chooseBackground()`,
     so on load there was no mark at all and the button could say "Off" with the
     whole panel unmarked: the state of the list was not visible until it was
     opened, and anyone only looking at the panel saw that nothing had been
     chosen. */
  markMenu();
}

(async () => {
  await loadBackgroundList();

  if (!backgrounds.list.length) {
    themeButton?.closest(".backgroundLayer")?.remove();
    return;
  }

  // Before drawing, what is stored is looked at. An index that no longer exists
  // —because the JSON has changed— is discarded and drawn again.
  const guardado = storedBackground();

  /* "off" is read before the thing goes through `Number`, and that is the reason
     this block changed: `Number("off")` is `NaN`, `list[NaN]` is `undefined`,
     and with the previous check a stored "off" became `null` — that is, Auto —
     and was cleared from storage. Choosing to switch it off was forgotten on its
     own on reload, which is exactly when it is noticed. */
  if (guardado === "off") {
    backgrounds.chosen = "off";
  } else {
    const indiceGuardado = guardado === "auto" || guardado === null ? null : Number(guardado);

    backgrounds.chosen = indiceGuardado !== null && backgrounds.list[indiceGuardado] ? indiceGuardado : null;

    /* An index that no longer exists, because the JSON changed, is discarded and
       drawn again. */
    if (guardado !== null && backgrounds.chosen === null) saveBackground(null);
  }

  if (backgrounds.chosen === "off") {
    stopBackground();
  } else {
    const candidatas = candidatos();
    setBackground(backgrounds.chosen === null
      ? (candidatas.length
        ? candidatas[Math.floor(Math.random() * candidatas.length)].indice
        : Math.floor(Math.random() * backgrounds.list.length))
      : backgrounds.chosen);
  }

  if (themeLabel) themeLabel.textContent = backgroundName(backgrounds.chosen);

  buildMenu();
})();

/** Changes the composition of the screen. It must never break the flow. */
function setState(value) {
  if (layout) layout.dataset.state = value;
}

/** Window title and counter. */
function setWindow(title, meta = "") {
  if (winTitle) winTitle.textContent = title;
  if (winMeta) winMeta.textContent = meta;
}

/** Closes the window and clears the results. */
function closeWindow() {
  reset();
  input.blur();
}

  { id: "tiktok", hosts: ["tiktok.com"] },
  { id: "youtube", hosts: ["youtube.com", "youtu.be", "music.youtube.com", "youtube-nocookie.com"] },
  { id: "pinterest", hosts: ["pinterest.com", "pin.it"] },
  { id: "pornhub", hosts: ["pornhub.com", "pornhub.org", "pornhubpremium.com"] },

/** Platform from the domain: any path will do (post, reel, story, /v/…). */
function detect(value) {
  const text = value.trim().replace(
    /^spotify:(track|album|playlist|artist|episode|show):([A-Za-z0-9]{10,})/i,
    "https://open.spotify.com/$1/$2",
  );

  if (!text) return null;

  let host;

  try {
    host = new URL(/^https?:\/\//i.test(text) ? text : `https://${text}`).hostname.toLowerCase();
  } catch {
    return null;
  }

  const bare = host.replace(/^www\./, "");

  return PLATFORMS.find((entry) => {
    if (entry.country?.test(bare)) return true;

    return entry.hosts.some((allowed) => bare === allowed || bare.endsWith(`.${allowed}`));
  })?.id ?? null;
}

 * It said "Theme", which is neither a state nor an action: it did not say which
 * state you are in nor what was about to happen. The icon already said one of the
 * two —the one that was showing was the current state's— and that is why the one
 * for the word and the one for the drawing pointed in different directions.
 *
 * Now both go to the target, and the text changes with the theme. The
 * `aria-label` already said it right before, so this brings it in line.

function applyTheme(theme) {
  root.dataset.theme = theme;

  const oscuro = theme === "dark";

  themeBtn.setAttribute("aria-label", oscuro ? "Switch to light theme" : "Switch to dark theme");
  if (themeWord) themeWord.textContent = oscuro ? "Light" : "Dark";

  let meta = document.querySelector('meta[name="theme-color"]');

  if (!meta) {
    meta = document.createElement("meta");
    meta.name = "theme-color";
    document.head.append(meta);

  meta.content = getComputedStyle(root).getPropertyValue("--bg").trim();

function storedTheme() {
  try { return localStorage.getItem("downloader-theme"); } catch { return null; }
}

/* What the system asks for, queried once and then followed as long as there is
   no own preference that changes it. */
const SISTEMA_OSCURO = matchMedia("(prefers-color-scheme: dark)");

/**
 * The theme the page starts on.
 *
 * Before it was always the light one. With the phone in dark mode, the page
 * opened on cream paper that suddenly glowed in a dark room, and you had to
 * press the button to get rid of it. Now, with no stored preference, whatever the
 * system says is respected.
 */
function initialTheme() {
  const guardado = storedTheme();

  if (guardado === "dark" || guardado === "light") return guardado;

  return SISTEMA_OSCURO.matches ? "dark" : "light";
}

function toggleTheme() {
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("downloader-theme", next); } catch {}
}

applyTheme(initialTheme());
themeBtn.addEventListener("click", toggleTheme);

/* While there is no own preference, the system has the last word and is kept
   track of: whoever closes the page in the afternoon and opens it again with the
   system in dark finds it dark. As soon as the button is pressed there is a
   stored preference and this rule does nothing any more —and it is not taken out
   of the way with a `removeEventListener` that would not be needed, because the
   `if` itself switches it off—. */
SISTEMA_OSCURO.addEventListener("change", (event) => {
  if (!storedTheme()) applyTheme(event.matches ? "dark" : "light");
});

/**
 * The platforms read themselves: two columns, one upwards and one downwards.
 * Each track carries double the cards, so on reaching -50% it sits exactly on top
 * of its copy and the loop closes without being noticed.
 *
 * The movement stops as soon as the user takes over (mouse, wheel, finger, Tab)
 * and also while the detected platform is being shown.
 */
const railCards = document.querySelector("#platformCards");

if (railCards && railUp && railDown) {
  const original = [...railCards.content.querySelectorAll(".pcard")];

  if (railCount) railCount.textContent = String(original.length);

  const copy = (cards) => {
    const block = document.createElement("div");

    block.className = "copy";

    for (const card of cards) block.append(card.cloneNode(true));

    return block;
  };

  // Two copies: the second one is what makes the invisible jump at the end.
  const fill = (track, cards) => {
    track.append(copy(cards), copy(cards));
  };

  // The second column is rotated so that it does not read like the first one.
  const half = Math.ceil(original.length / 2);

  fill(railUp, original);
  fill(railDown, [...original.slice(half), ...original.slice(0, half)]);

  // The speed does not depend on how many platforms there are: the pace is set
  // per card, not the duration of the loop.
  for (const track of [railUp, railDown]) {
    track.style.animationDuration = `${original.length * 4.6}s`;
  }
}

function humanize(raw, platform) {

  const name = platform ? PLATFORMS.find((entry) => entry.id === platform)?.id : null;

  /* The order matters and this one was the wrong way round.

     The "no connection" pattern carried the bare word `network`, and the server's
     blocking message carries it too: "The platform's server blocked the
     download (HTTP 403). Usually an IP or region restriction; try from another
     network." Since it was tried first, it ate the blocking one and told the
     visitor the problem was their connection, when the problem is that the
     platform's CDN does not allow downloading from a datacenter IP, which is the
     most common failure there is.

     The specific one is tried first, which only matches its own message, and then
     the generic one. And the bare word `network` comes out of the second: `fetch`
     produces `fetch failed` in Node and `Failed to fetch` in the browser, never a
     plain "network", so it was not needed for anything. */
  if (/blocked the download|block screen|age gate|\b(401|403|451)\b/i.test(text)) {
    return name
      ? `${BRAND[name] ?? name} won't let you download from this network`
      : "this platform won't let you download from this network";

     translated, none of them matched: everything ended in «that link couldn't be

  if (/story|stories|IG_COOKIE|signed[- ]in|session|cookie/i.test(text)) return "that story isn't available";
