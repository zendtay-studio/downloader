/* ==========================================================================
   DOWNLOADER · visual system
   1 tokens · 2 base · 3 typography · 4 topbar · 5 layout · 6 rail
   7 compositor · 8 shortcuts · 9 items · 10 upload button · 11 settings
   ========================================================================== */

/* ------------------------------------------------------------- 1 tokens -- */
:root {
  color-scheme: light;

  /* surfaces: cream paper */
  --bg: #f5f0e6;
  --card: #fdfbf7;
  --card-2: #f1eadc;
  --card-3: #e7dfce;

  /* Veil over the background video, alpha included. It lives in one token
     instead of `--veil` plus a separate `--velo-a` because no browser accepts
     `rgb(var(--veil) / var(--velo-a))`: putting a `var()` inside `rgb()` makes
     the declaration fail to parse and it is dropped whole, which fails silently
     —the browser swallows it and says nothing. With the full colour in one go
     there is nothing to parse.

     The alpha is only what it takes to take the background down. With no veil
     the video's median luminance is 213 and p95 244, so it is nearly as light as
     the cards and they stop reading as a panel. */
  --veil: rgba(245, 240, 230, .26);

  /* ── glass ──
     The surfaces stop being flat colour and become translucent, so the
     background video shows through and the page reads as one thing instead of a
     panel on top of another.

     The alpha is not a matter of taste, but the site it is measured against can
     move. It used to be .66 and the faint text gave 5.34:1 against the darkest
     background that can sit under a panel — grey 119, which is what the cream
     veil leaves over the darkest part of the video. Lowering the glass shows
     more video and at the same time brings the panel closer to the text colour,
     so the two are tied together and cannot be touched separately.

     The fix is to lower the alpha AND raise the text contrast by the same
     amount. At .50 the panel falls to 48.6 luminance in the worst case, and the
     faint text needs grey 80 instead of the 92 it had. The three steps land at
     8.64, 5.57 and 4.54:1, and that last one is the floor.

     The border and the top highlight are what make it read as glass rather than
     just transparency: without them this would be a semitransparent rectangle. */
  --cristal: rgba(253, 251, 247, .50);
  --cristal-borde: rgba(255, 255, 255, .72);
  --cristal-luz: rgba(255, 255, 255, .85);
  --cristal-sombra: rgb(38 30 18 / .07);
  --cristal-filtro: blur(16px) saturate(180%);
  /* Hover and inner items raise the alpha instead of changing colour. The item
     sits at .72, ABOVE the window's .66: the other way round it read as if the
     item floated behind the glass, so it was indistinguishable from the window.
     Worst-case background, .72 gives 5.15:1 with the faintest text. */
  --cristal-hover: rgba(253, 251, 247, .70);
  --cristal-item: rgba(253, 251, 247, .56);

  /* borders */
  --line: #e3daca;
  --line-2: #cfc4b0;
  --line-ctrl: #94866f;

  /* text: three luminance steps */
  --text-1: #201c17;
  --text-2: #423c32;
  /* With translucent cards the text no longer has a fixed background, so this
     token is the one that sets the floor: 4.5:1 against the darkest background
     that can sit under a panel, not against the panel's own colour. With the
     glass at .50 it needs grey 80; the previous value, 92, gave 4.76:1 but over
     a panel that covered more video. */
  --text-3: #50493d;

  /* neutral accent: ink, no colour */
  --accent: #1f1b16;
  --accent-ink: #fdfbf7;
  --accent-soft: rgb(31 27 22 / .1);
  --halo: rgb(255 255 255 / .55);

  --ok: #1f7a4d;
  --warn: #8a5a12;
  --err: #b02a24;


  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
             "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  /* typography */
  --t-display: clamp(26px, 3vw, 32px);
  --t-title: 20px;
  --t-body: 16px;
  --t-sub: 14px;
  --t-micro: 12px;

  /* spacing, base 4 */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;

  /* restrained radii */
  --r-1: 6px;
  --r-2: 10px;
  --r-3: 14px;
  --r-pill: 999px;

  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
  --shadow-float: 0 6px 20px -8px rgb(64 51 30 / .22);
  --shadow-press: inset 0 1px 2px rgb(64 51 30 / .14);

  /* ── bar ink ──
     The bar has no background, so its colour does not rest on a panel: it
     depends on what is behind it, which is the video. These two tokens are what
     the JavaScript swaps by measuring the frame under the bar.

     The name comes from the INK, not the background, because the background is
     what gets decided: with `dark` the ink is dark because the background is
     light, and the other way round. Naming it after the background would mean
     remembering to invert it every time it is used.

     `--ink-barra-fuerte` is the hover colour, which with the same ink cannot be
     told apart from where it is. It does not point at the theme's `--text-1`
     because that can land on the wrong side: if the bar is over a dark
     background the hover has to be LIGHTER, not darker. */
  --ink-barra: var(--text-1);
  --ink-barra-fuerte: var(--text-1);

  --pad: 32px;
  --gap: 28px;
  --rail-w: 372px;

  /* Device safe area. On a notched Android or in fullscreen, `viewport-fit=cover`
     lets the page draw under the status bar: without reserving this space the top
     bar is covered and the downloader looks stuck underneath it. On desktop it is
     0 and changes nothing. */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  /* Bar height, and with it everything that occupies the top: the safe area, the
     bar and its padding. Every height and every `sticky` is computed against
     this, not against the bar on its own.

     With the bar having no background or line, the space above is the only thing
     separating it from the edge: without it the logo and the theme sit flush
     against the screen edge. It is included INSIDE `--topbar`, never above it, so
     that `--chrome` keeps telling the truth and nothing is mounted over the
     content. */
  --topbar: 70px;
  --bar-pad: 14px;
  /* Everything that occupies the top: the safe area plus the bar. Every height
     and every `sticky` is computed against this, not against the bar on its own. */
  --chrome: calc(var(--topbar) + var(--safe-top));

  /* List height: it always fits between the top bar and the bottom edge, with a
     floor and a ceiling so that even a phone in landscape cannot overflow. */
  --rail-h: clamp(200px, min(60dvh, calc(100dvh - var(--chrome) - var(--s-5))), 620px);
  --win-h: clamp(280px, min(660px, calc(100dvh - var(--chrome) - var(--s-5))), 660px);
  --col: 1600px;
  --ease: cubic-bezier(.2, .7, .3, 1);

  /* ── movement ──
     Every transition used to pick its own duration out of thin air: there were
     eight different ones —.12, .15, .18, .2, .25, .3, .34 and .4— and none of
     them repeated much. The result was neither slow nor fast, it was irregular:
     two things leaving at the same time took different times and the eye reads
     that as one lagging behind the other.

     There are four steps now and that is all. The assignment is by what the thing
     does, not how long it lasts:

       --d-1  a state changes and that is all  a text colour, a chip fill
       --d-2  something appears             a button, a menu, an entering card
       --d-3  something repositions        the view, a card hover
       --d-4  something fills the screen   the window, the loading skeleton

     And two curves. The entrance curve brakes harder at the end, which is what
     makes something that appears seem to arrive rather than start moving; the
     standard one serves state changes, which neither enter nor leave. */
  --d-1: 120ms;
  --d-2: 180ms;
  --d-3: 260ms;
  --d-4: 380ms;
  --ease-out: cubic-bezier(.16, .84, .34, 1);
  --ease-in-out: cubic-bezier(.5, 0, .2, 1);

  /* How far a surface lifts on hover. One pixel: more makes the tremor
     noticeable on a small card, less is not visible. */
  --lift: -1px;
}

/* Dark theme: always opt-in, never the default. */
:root[data-theme="dark"] {
  color-scheme: dark;

  --bg: #14120f;
  --card: #1c1916;
  --card-2: #23201c;
  --card-3: #2b2723;

  /* At night the veil has to work harder: the same video at luminance 213 behind
     cards at 26 washed them out. At .60 the background falls to a median of 85
     and 98 at p95, and between the light and dark areas of the video there are
     still 66 levels of difference: the video still shows, it just stops competing
     with the interface. */
  --veil: rgba(10, 9, 8, .60);

  /* At night the tint is that of the dark panel and the alpha drops to .46,
     because the background is already so low that it does not need much veil. The
     panel sits at 5.1 luminance against grey 95 —what the veil at 60% leaves over
     the lightest part of the video— and that is where `--text-3` is the binding
     constraint.

     The glass went from .55 to .46, a little less than in light, because at night
     the three text steps were already near the floor and dropping it further
     sank all of them. With the new alpha the faint one goes from 4.60 to 4.54:1
     and the other two rise, because `--text-2` and `--text-3` were lightened by
     17 and 7 units.

     All these numbers come from compositing in sRGB and CLAMPING to eight bits,
     which is what the browser does. Measured in floating point the panel comes
     out a shade lighter and the faint text "measures" 4.85:1 when it is really
     4.54:1, which is exactly the floor: that clamping is where you notice. */
  --cristal: rgba(30, 27, 24, .46);
  --cristal-borde: rgba(255, 255, 255, .14);
  --cristal-luz: rgba(255, 255, 255, .10);
  --cristal-sombra: rgb(0 0 0 / .30);
  --cristal-filtro: blur(16px) saturate(150%);
  --cristal-hover: rgba(38, 34, 30, .62);
  --cristal-item: rgba(38, 34, 30, .54);

  --line: #2e2a25;
  --line-2: #3d3830;
  --line-ctrl: #72695a;

  --text-1: #f2ede4;
  --text-2: #c1b8a7;
  /* The other way round here: with the translucent card the background can rise to
     5.1 luminance, and a mid grey on top of that eats the contrast. With the
     glass at .46 this token needs grey 179; its old value, 172, gave 4.60:1. */
  --text-3: #b3ab9b;

  --accent: #ede7dc;
  --accent-ink: #17140f;
  --accent-soft: rgb(237 231 220 / .12);
  --halo: rgb(255 255 255 / .05);

  --ok: #5fbe8b;
  --warn: #e8b45f;
  --err: #ff8a85;


  --shadow-float: 0 8px 24px -10px rgb(0 0 0 / .6);
  --shadow-press: inset 0 1px 2px rgb(0 0 0 / .4);
}


/* The brand colour only comes in once the platform is detected. This sits after
   the dark theme so the brand also wins with the theme off. */
:root[data-platform="snapchat"] { --accent: #8a6d00; --accent-ink: #fff; --accent-soft: rgb(255 252 0 / .3); --halo: rgb(255 252 0 / .22); }
:root[data-platform="ok"] { --accent: #cf5c12; --accent-ink: #fff; --accent-soft: rgb(207 92 18 / .1); --halo: rgb(207 92 18 / .1); }
:root[data-platform="bluesky"] { --accent: #0a6fd4; --accent-ink: #fff; --accent-soft: rgb(28 148 255 / .12); --halo: rgb(28 148 255 / .12); }
:root[data-platform="x"] { --accent: #1b1b1b; --accent-ink: #fff; --accent-soft: rgb(27 27 27 / .1); --halo: rgb(27 27 27 / .06); }
:root[data-theme="dark"][data-platform="x"] { --accent: #ededed; --accent-ink: #17140f; --accent-soft: rgb(237 237 237 / .12); --halo: rgb(255 255 255 / .05); }
:root[data-platform="facebook"] { --accent: #0f5fc0; --accent-ink: #fff; --accent-soft: rgb(15 95 192 / .1); --halo: rgb(15 95 192 / .1); }
/* Threads is monochrome, so it shares X's treatment: ink on light, paper on dark,
   with a very weak halo so it does not dirty the background. */
:root[data-platform="threads"] { --accent: #1a1a1a; --accent-ink: #fff; --accent-soft: rgb(26 26 26 / .1); --halo: rgb(26 26 26 / .06); }
:root[data-theme="dark"][data-platform="threads"] { --accent: #f2f2f2; --accent-ink: #17140f; --accent-soft: rgb(242 242 242 / .12); --halo: rgb(255 255 255 / .05); }

/* The ink the bar picks according to what is behind it. Placed AFTER the dark
   theme on purpose, same as the brand colours: if it were before, the dark theme
   would override it and the bar would go back to its theme's colour, which is
   exactly what this rule exists to prevent.

   The two ink values are not the same as the theme's, and that is on purpose:
   they go further in their own direction so they still read over a light
   background that is not quite white. On cream paper the dark ink is a very dark
   grey instead of the theme's black, and at night it is a cream instead of the
   theme's white. */
:root[data-ink="dark"]  { --ink-barra: #14120f; --ink-barra-fuerte: #000; }
:root[data-ink="light"] { --ink-barra: #f5f0e6; --ink-barra-fuerte: #fff; }
:root[data-platform="instagram"] { --accent: #c21d5a; --accent-ink: #fff; --accent-soft: rgb(194 29 90 / .1); --halo: rgb(194 29 90 / .1); }
:root[data-platform="youtube"]   { --accent: #c41e27; --accent-ink: #fff; --accent-soft: rgb(196 30 39 / .1); --halo: rgb(196 30 39 / .1); }
:root[data-platform="pinterest"] { --accent: #a80f22; --accent-ink: #fff; --accent-soft: rgb(168 15 34 / .1); --halo: rgb(168 15 34 / .1); }
:root[data-platform="pornhub"]   { --accent: #c96a06; --accent-ink: #1a1512; --accent-soft: rgb(201 106 6 / .12); --halo: rgb(201 106 6 / .1); }
/* TikTok and Dailymotion had no accent at all, which is the case the comment on
   `BRAND` warns about: three places to remember, and forgetting one is not an
   error. Both fell back to the neutral ink, so the page looked right and neither
   platform was ever tinted. Their marks are what the brand colours come from —
   black-and-magenta play button, white on blue. */
:root[data-platform="tiktok"]     { --accent: #d9356e; --accent-ink: #fff; --accent-soft: rgb(217 53 110 / .1); --halo: rgb(217 53 110 / .1); }
:root[data-theme="dark"][data-platform="tiktok"] { --accent: #f26f9d; --accent-ink: #17140f; --accent-soft: rgb(242 111 157 / .12); --halo: rgb(255 255 255 / .05); }
:root[data-platform="dailymotion"]{ --accent: #0f5fd0; --accent-ink: #fff; --accent-soft: rgb(15 95 208 / .1); --halo: rgb(15 95 208 / .1); }

/* The detected platform's card. There used to be fourteen identical rules, one
   per brand, because CSS cannot compare the value of `data-platform` with that of
   `data-p`. `tint()` sets it with `data-active` instead, so adding a platform
   does not mean touching the CSS. */
.pcard[data-active] {
  border-color: color-mix(in srgb, var(--accent) 62%, var(--line));
  background: color-mix(in srgb, var(--accent) 7%, var(--card));
}
:root[data-platform="kwai"]      { --accent: #e0431a; --accent-ink: #fff; --accent-soft: rgb(224 67 26 / .12); --halo: rgb(224 67 26 / .1); }
:root[data-platform="reddit"]    { --accent: #d63b00; --accent-ink: #fff; --accent-soft: rgb(255 69 0 / .12); --halo: rgb(255 69 0 / .12); }
:root[data-platform="spotify"]   { --accent: #12833c; --accent-ink: #fff; --accent-soft: rgb(29 185 84 / .12); --halo: rgb(29 185 84 / .12); }
:root[data-platform="soundcloud"] { --accent: #d1400f; --accent-ink: #fff; --accent-soft: rgb(255 68 0 / .12); --halo: rgb(255 68 0 / .12); }
:root[data-platform="vimeo"]     { --accent: #1ab7ea; --accent-ink: #06222c; --accent-soft: rgb(26 183 234 / .12); --halo: rgb(26 183 234 / .12); }
:root[data-platform="streamable"]{ --accent: #0f9bc4; --accent-ink: #fff; --accent-soft: rgb(15 155 196 / .12); --halo: rgb(15 155 196 / .12); }
:root[data-platform="rutube"]   { --accent: #ff8c00; --accent-ink: #1a1000; --accent-soft: rgb(255 140 0 / .12); --halo: rgb(255 140 0 / .12); }
:root[data-platform="bilibili"] { --accent: #fb7299; --accent-ink: #fff; --accent-soft: rgb(251 114 153 / .12); --halo: rgb(251 114 153 / .12); }
:root[data-platform="loom"]      { --accent: #625df5; --accent-ink: #fff; --accent-soft: rgb(98 93 245 / .12); --halo: rgb(98 93 245 / .12); }

/* ── LAYER 1: glass ──
   The downloader, the shortcuts panel, the results window and the platform cards
   stop being flat colour: they get a translucent tint, a blur of what is behind
   them and a bright edge up top.

   The edge and the border are half the effect. A `backdrop-filter` without them
   looks like a smudge; with them it looks like glass, because light falls
   differently at the top edge than at the bottom. That is why the highlight is a
   one-pixel `inset` and not a plain border.

   The four selectors together on purpose: if any of them goes opaque the page
   reads as separate pieces sitting on a background again, which is exactly what
   the glass is here to fix. */
/* `.pcard` is deliberately NOT here. The platform cards are 84 small entries in
   the rail column, and each one with its own `backdrop-filter` is 64 live blurs
   over a nearly uniform background: you cannot see the difference and the GPU
   pays all of it. They carry the same alpha and the same edge, which is what
   makes them glass, but no filter. */
.hero,
.panel-keys,
.window,
.theme-menu {
  background: var(--cristal);
  border-color: var(--cristal-borde);
  box-shadow:
    inset 0 1px 0 var(--cristal-luz),
    0 1px 2px var(--cristal-sombra);
  backdrop-filter: var(--cristal-filtro);
  -webkit-backdrop-filter: var(--cristal-filtro);
}

/* --------------------------------------------------------------- 2 base -- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  padding-bottom: max(28px, calc(var(--safe-bottom) + 20px));
  font-family: var(--font-ui);
  font-size: var(--t-body);
  line-height: 1.5;
  color: var(--text-1);
  background: var(--bg);
  overscroll-behavior-y: contain;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--d-3) var(--ease), color var(--d-3) var(--ease);
}

/* ── LAYER -1: background video ──
   Fixed, behind everything, with no pointer events. The `body` remains the real
   background when the video does not load, so if anything fails you see the
   normal page and not a hole. */
.backdrop {
  position: fixed;
  inset: 0;
  z-index: -1;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* The 20px blur. The video is full of fine detail and at this distance only the
     masses of light and shadow are read, which is all a background needs. */
  filter: blur(20px);
  /* The blur eats the element's edge: blurring makes the 20px beyond the edge
     transparent, and since the element is exactly screen-sized, a smooth frame in
     the `body` colour comes out around the video. It is scaled 12% so that soft
     edge falls outside the view. `object-fit: cover` already crops plenty, so the
     extra crop is not noticeable: it only raises the scale by 6% per side. */
  transform: scale(1.12);
  border: 0;
  pointer-events: none;
}

/* ── LAYER -1: veil over the video ──
   Sits ON TOP of the video and BELOW the content, and it is not opaque: it is a
   mix with the theme colour, so it attenuates the video instead of hiding it.

   The order is not a coincidence. All three sit on the `z-index: -1` floor, and
   within the same stacking context the document order decides: `::before` (the
   halo) paints first, then the video, then this `::after`, and last the content.
   That is why the veil is a pseudo-element of `body` and not a loose `<div>` — a
   div at the end of the body would paint just as well, but the pseudo makes it
   clear that it deliberately shares a floor with the video. */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: var(--veil);
  transition: background-color var(--d-3) var(--ease);
}

/* ── LAYER 0: the dot field ──
   The canvas covers the screen, takes no pointer events and is transparent by
   default: it only paints where there are dots. `will-change` is unnecessary —a
   canvas that changes every frame is already on its own layer— and setting it
   would only reserve memory for nothing. */
#campo {
  position: fixed;
  inset: 0;
  z-index: 0;
  /* Not one pixel of this canvas may take a click. */
  pointer-events: none;
}

/* With no fine pointer there is nothing to look at, and `prefers-reduced-motion`
   rules it out too. The field is the only thing on the page that moves without
   anyone asking for it, and that is exactly what that preference exists to
   remove. */
@media (pointer: coarse), (prefers-reduced-motion: reduce) {
  #campo { display: none; }
}

/* ── LAYER -1: paper light ── */
body::before {
  content: "";
  position: fixed;
  inset: -8% -4% auto;
  height: 44vh;
  background: radial-gradient(56% 50% at 50% 0%, var(--halo), transparent 72%);
  pointer-events: none;
  z-index: -1;
  transition: background var(--d-4) var(--ease);
}

::selection { background: var(--accent); color: var(--accent-ink); }

:where(button, input, [tabindex]):focus-visible { outline: none; box-shadow: var(--ring); }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
svg { display: block; }

/* `hidden` beats any component `display`. */
[hidden] { display: none !important; }

.app {
  /* Above the background canvas (`z-index: 0`). Without this `position` the
     `z-index` would not apply and the dot field would paint over the text. It is
     given `1` and no more on purpose: the `.topbar` with its 30, the backgrounds
     menu with its 40 and the upload button stay the topmost because all three
     live inside this same box, so they still compare against each other as they
     did before. */
  position: relative;
  z-index: 1;

  width: 100%;
  max-width: min(var(--col), 100%);
  margin-inline: auto;
  padding-top: var(--safe-top);
  padding-inline: max(var(--pad), var(--safe-left))
                max(var(--pad), var(--safe-right));
}

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 3px solid transparent; border-radius: var(--r-pill); background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

/* -------------------------------------------------------- 3 typography -- */
/* Readable small caps: a normal sentence with an initial capital. */
.u-label {
  font-size: var(--t-sub);
  font-weight: 600;
  color: var(--text-3);
}

kbd {
  padding: 2px 6px;
  font-family: var(--font-mono);
  font-size: var(--t-micro);
  color: var(--text-2);
  background: var(--card-2);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: var(--r-1);
}

/* ------------------------------------------------------------ 4 topbar -- */
.topbar {
  position: sticky;
  /* It stops just below the status bar, not at the edge of the screen. */
  top: var(--safe-top);
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  height: var(--topbar);
  padding-top: var(--bar-pad);
  margin-inline: calc(-1 * var(--pad));
  padding-inline: var(--pad);
  /* No background, no blur and no line. The translucent sheet with its border
     BELOW turned the bar into a stripe, and since the page background is flat
     there was nothing to justify the glass: it only covered things up. The blur
     goes with it, because with no background behind it would only distort the
     halo of `body::before` as it crossed. */
}

.brand { display: flex; align-items: center; gap: var(--s-2); }

/* The icon stands alone, with no coloured box behind it and no name beside it:
   the name is already in the `<title>`, in the tab and in the card's heading, and
   in the top bar it only needs to be an anchor. The box added nothing either —it
   was a square of the platform colour in a corner— and with the bar now
   backgroundless it was left dangling. */
.mark {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  color: var(--ink-barra);
  /* The brand arrow tilts a little on hover. It is a tiny flourish, but it was
     the one thing in the bar that did not move, and once everything else was
     animating what you notice is exactly what is missing. */
  transition: transform var(--d-2) var(--ease), color var(--d-2) var(--ease);
}

@media (hover: hover) { .mark:hover { transform: translateY(1px) scale(1.06); color: var(--ink-barra-fuerte); } }

.mark svg { width: 21px; height: 21px; }

/* The two corners on the right: the link to the repository and the theme. They go
   in one group so the bar's `space-between` holds them both against the edge,
   instead of one stuck to the brand icon. */
.topbar-end { display: flex; align-items: center; gap: var(--s-4); }

/* The GitHub logo is just another glyph in the bar: no box, no border, the same
   padding and the same hover colour change as the theme button. It opens in a new
   tab because that is the convention for an external link, and with `noopener` so
   the target tab does not get a handle on this one. */
.repo {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  color: var(--ink-barra);
  border-radius: var(--r-1);
  transition: color var(--d-2) var(--ease);
}

.repo svg { width: 19px; height: 19px; }

/* ── background picker ─────────────────────────────────────────────────────
   A popover, not a `<select>`: the native one draws its list with the operating
   system's look, looks just as alien on a phone as on a laptop, and supports
   neither glass nor blur. This is a `button` plus a panel, so it resembles what
   iOS does when you open a menu of this kind: it comes out flush against the
   button, with a translucent background and the same curve as the rest of the
   page. */
.backgroundLayer { position: relative; }

.theme-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 9px 0 7px;
  border: 0;
  border-radius: var(--r-1);
  background: none;
  color: var(--ink-barra);
  font: inherit;
  cursor: pointer;
  transition: color var(--d-2) var(--ease), background-color var(--d-2) var(--ease);
}

.theme-btn:hover { color: var(--ink-barra-fuerte); }
.theme-btn[aria-expanded="true"] { color: var(--text-1); background: var(--card-2); }

.theme-btn .i-background { width: 17px; height: 17px; flex: none; }

/* The word only shows when there is room. In a narrow window the icon is enough,
   and the extra text only makes the rest of the bar shift around. */
.theme-word { font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; }

@media (max-width: 560px) {
  .theme-word { display: none; }
  .theme-btn { padding: 0 7px; }
}

/* The panel. The `--veil` is the same token the panels' glass relies on, so it
   separates the same way in dark and in light. */
.theme-menu {
  position: absolute;
  top: calc(100% + 9px);
  right: 0;
  z-index: 40;
  min-width: 186px;
  max-height: min(58vh, 420px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px;
  border: 1px solid transparent;
  border-radius: 14px;
  /* The background, border, highlight and filter come from the page's glass
     rule, further up. Only what is specific to the panel lives here: the shadow
     that lifts it off the background and the maximum height. */
  box-shadow:
    inset 0 1px 0 var(--cristal-luz),
    0 1px 2px var(--cristal-sombra),
    0 12px 32px -12px rgb(0 0 0 / .28);

  /* It comes in with a short scale from the button, which is where the gesture
     comes from on iOS. `scale` rather than opacity alone because then you can see
     where it comes from. */
  transform-origin: top right;
  animation: themeEnter var(--d-2) cubic-bezier(.2, .9, .3, 1);
}

.theme-menu[hidden] { display: none; }

@keyframes themeEnter {
  from { opacity: 0; transform: scale(.94) translateY(-5px); }
  to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .theme-menu { animation: none; }
}

.background-option {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--text-1);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--d-1) ;
}

.background-option:hover { background: var(--card-2); }

.background-option[aria-checked="true"] { font-weight: 600; }

/* The check. It always holds its place, checked or not, and is only visible when
   checked: that way every item's text starts in the same spot and the list does
   not jump when you pick one. */
.background-option .i-check {
  width: 15px;
  height: 15px;
  flex: none;
  opacity: 0;
  transition: opacity var(--d-1) ;
}

.background-option[aria-checked="true"] .i-check { opacity: 1; color: var(--text-1); }

/* The veil thrown behind while the panel is open, so that clicking outside
   closes it and that is noticeable. */
.theme-veil {
  position: fixed;
  inset: 0;
  /* Shares a stacking context with the panel, so it only has to land under its
     40. */
  z-index: 35;
  background: rgb(0 0 0 / .18);
  animation: themeFade var(--d-2) ease-out;
}

@keyframes themeFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .theme-veil { animation: none; }
}

/* The theme stays text and sun only: no pill and no border, like the brand icon
   and the repo logo. All three were the same flourish and together they turned
   the bar into three boxes —icon, pill and a line underneath— on a background
   that is already flat. */
.theme {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  height: 34px;
  padding-inline: 0;
  color: var(--ink-barra);
  border-radius: var(--r-1);
  transition: color var(--d-2) var(--ease);
}

.theme .glyph { display: grid; place-items: center; width: 15px; height: 15px; }
.theme svg { width: 15px; height: 15px; }

/* One rule for the words on both of the bar's buttons. The light/dark toggle is
   `class="theme"` and the background picker and the install button are
   `class="theme-btn"`, so a selector scoped to either one leaves the other two on
   a fixed colour — which is the same bug twice, in two directions. Both words are
   `.theme-word` and the colour is set on that, once, further up. */
.theme-word { color: var(--ink-barra); }

/* Each icon shows where the button takes you, which is what the word beside it
   says: in light the moon —pressing goes to dark— and in dark the sun. Before,
   each icon showed the state you were already in, so the button said one thing
   and the other had to be inferred from the drawing. */
:root[data-theme="dark"] .theme .moon { display: none; }
:root[data-theme="light"] .theme .sun { display: none; }

@media (hover: hover) {
  .theme:hover,
  .repo:hover { color: var(--ink-barra-fuerte); }
}

/* ------------------------------------------------------------ 5 layout -- */
/* The bar and the grid are siblings, not two rows of the same grid, so the
   `gap` below does not separate them: without this margin the bar's border sat
   flush against the downloader card's. */
.layout {
  display: grid;
  grid-template-areas: "main" "results" "rail";
  gap: var(--s-4);
  align-content: start;
  margin-top: var(--s-4);
}

.column { grid-area: main; }
.window { grid-area: results; }
.rail { grid-area: rail; }

.column, .rail { min-width: 0; }
.column { display: grid; gap: var(--s-4); align-content: start; }

/* The body is always centred, in any state: resolving a link must not shift
   the page. */
@media (min-width: 768px) {
  .layout {
    min-height: calc(100dvh - var(--chrome) - var(--s-6));
    align-content: center;
  }
}

/* The downloader does not stretch: from here on it has a reading width. */
@media (min-width: 720px) {
  .column, .layout > .window { width: 100%; max-width: 560px; justify-self: center; }
}

@media (min-width: 1024px) {
  .layout {
    grid-template-areas: "rail main" "rail results";
    grid-template-columns: 300px minmax(0, 1fr);
    column-gap: var(--gap);
    row-gap: var(--s-5);
    align-items: start;
  }

  .column,
  .layout > .window { align-self: center; }
}

/* From 721 px there is genuinely room for two columns. A tablet in portrait or a
   phone in landscape should not be left with a 560 px column in the middle and a
   third of the screen empty on each side. Below this width the rail is a strip
   and the single column is the right answer. */
@media (min-width: 721px) and (max-width: 1023px) {
  :root { --win-h: clamp(260px, min(70dvh, calc(100dvh - var(--chrome) - var(--s-5))), 620px); }

  .layout {
    grid-template-areas: "rail main" "rail results";
    grid-template-columns: minmax(220px, 272px) minmax(0, 1fr);
    column-gap: var(--s-5);
    row-gap: var(--s-4);
    align-items: start;
  }

  .column { align-self: center; }

  /* The two side pieces stick together: otherwise, on a long scroll the rail
     ends up at the very top and the window leaves on its own. */
  .rail,
  .layout > .window { position: sticky; top: calc(var(--chrome) + var(--s-4)); }
}

@media (min-width: 1320px) {
  :root { --pad: 36px; }

  /* Both side columns measure the same: that way the grid axis lines up with
     the centre of the screen and the downloader ends up centred. */
  .layout {
    grid-template-areas: "rail main results";
    grid-template-columns: minmax(280px, 1fr) minmax(0, 560px) minmax(280px, 1fr);
    align-items: start;
  }

  .column {
    justify-self: center;
    align-self: center;
    width: 100%;
  }

  .window { position: sticky; top: calc(var(--chrome) + var(--s-4)); }

  .rail {
    position: sticky;
    top: calc(var(--chrome) + var(--s-4));
    max-height: calc(100dvh - var(--chrome) - var(--s-6));
  }
}


/* --------------------------------------------------------------- 6 rail -- */
/* The platform list is no longer a window: they are two columns that scroll on
   their own, one upwards and one downwards, repeating their content so the loop
   never stops. */
.rail {
  display: grid;
  align-content: start;
  justify-self: end;
  width: var(--rail-w);
  max-width: 100%;
}

.platforms {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: var(--s-3);
  width: 100%;
  height: var(--rail-h);
  /* Cards are measured against the rail's width, not the screen's: that way the
     column reads just as well at 264 px as at 500. */
  container-type: inline-size;
  container-name: rail;
}

.platforms-title {
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
  margin: 0;
  padding-inline: 2px;
  font-size: var(--t-micro);
  letter-spacing: .06em;
  text-transform: uppercase;
}

.platforms-title span {
  margin-left: auto;
  font-family: var(--font-mono);
  letter-spacing: 0;
}

.marquee {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--s-2);
  min-height: 0;
  overflow: hidden;
  /* The list has no beginning and no end: it fades out at the top and at the bottom. */
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 14%, #000 86%, transparent);
}

/* The edge blur: `backdrop-filter` does erase what is behind, so the cards are
   literally blurred as they reach the top. */
.marquee::before,
.marquee::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  z-index: 1;
  height: 26px;
  pointer-events: none;
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
}

.marquee::before {
  top: 0;
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
  mask-image: linear-gradient(to bottom, #000, transparent);
}

.marquee::after {
  bottom: 0;
  -webkit-mask-image: linear-gradient(to top, #000, transparent);
  mask-image: linear-gradient(to top, #000, transparent);
}

.track {
  display: grid;
  will-change: transform;
  animation: roll 64s linear infinite;
}

/* Each lap gets its own block, with the same gap at the end. If the `gap` were
   on the track, half the height would fall into a half gap and the loop would
   jump 4 px on every lap. */
.copy {
  display: grid;
  gap: var(--s-2);
  padding-bottom: var(--s-2);
}

/* The second one runs the other way: the two columns are never read alike. */
.track--down { animation-direction: reverse; }

/* Each track carries double the cards: at -50% it lands exactly on top of the
   first copy, so the loop is not noticeable. */
@keyframes roll {
  from { transform: translateY(0); }
  to { transform: translateY(-50%); }
}

/* The list never stops: not on hover, not on detecting a platform, not while
   downloading. It only freezes under `prefers-reduced-motion`, which the general
   block further down already handles. */

@media (min-width: 1200px) {
  .rail {
    position: sticky;
    top: calc(var(--chrome) + var(--s-4));
  }

  /* The results window sticks too; `sticky` also serves as context for the
     carousel arrows, so it wins with both classes and is not overridden by the
     `relative` in the general rule. */
  .layout > .window {
    position: sticky;
    top: calc(var(--chrome) + var(--s-4));
  }

}

@media (max-width: 1023px) {
  .rail { width: 100%; justify-self: stretch; }
}

/* On a phone the platform list stops being a marquee and becomes a fixed
   two-column grid, still. It used to be two columns scrolling up and down
   endlessly, taking up almost 400 px below everything else; in a grid it reads
   at a glance, costs no battery, and with twenty-one platforms it is eleven
   rows, with no orphan row at the end. */
@media (max-width: 720px) {
  .platforms {
    height: auto;
    grid-template-rows: auto auto;
  }

  .marquee {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--s-2);
    overflow: visible;
    -webkit-mask-image: none;
    mask-image: none;
  }

  /* The blurred edges exist for the infinite scroll. Here the list has a
     beginning and an end, so they would only blur real cards. */
  .marquee::before,
  .marquee::after { display: none; }

  /* The two copies that make the infinite loop possible are in the way here: in
     a grid they would show the 21 platforms repeated. */
  .track { display: contents; animation: none; will-change: auto; }
  .track--down,
  .track > .copy ~ .copy { display: none; }
  .copy { display: contents; }
}


.pcard {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  align-items: center;
  gap: 2px var(--s-3);
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  /* Here the number does matter: there are eighty-four cards, and they all move
     at once when the marquee starts. That is why hover does NOT touch
     `box-shadow` —painting a shadow is the most expensive thing there is, and
     here it would be paid 84 times— and is limited to `transform` and colours,
     which go through the compositor and the paint thread without falling back
     to the shadow.

     The tint's alpha is raised instead of changing colour, because a flat colour
     would cover the background video. */
  transition: transform var(--d-2) var(--ease), border-color var(--d-2) var(--ease), background-color var(--d-2) var(--ease);
  /* Background and border are in the glass rule. */
}

@media (hover: hover) {
  .pcard:hover {
    border-color: var(--cristal-borde);
    background: var(--cristal-hover);
    transform: translateY(var(--lift));
  }
}

.picon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  grid-row: span 2;
  color: var(--text-2);
  background: var(--card-2);
  border-radius: var(--r-1);
}

.picon svg { width: 19px; height: 19px; }

.pcard[data-p="dailymotion"] .picon { color: #17140f; background: rgb(23 20 15 / .07); }
.pcard[data-p="snapchat"]   .picon { color: #8a6d00; background: rgb(255 252 0 / .3); }
.pcard[data-p="ok"]        .picon { color: #d4610c; background: rgb(212 97 12 / .12); }
/* Bluesky's mark is a light blue on a light blue tint, which measured 2.61:1 —
   the only icon of the twenty-one below the 3:1 a graphical object needs. It is
   darkened to the same value as its `--accent`, which is what most of the others
   do. */
.pcard[data-p="bluesky"]   .picon { color: #0a6fd4; background: rgb(31 143 255 / .14); }
.pcard[data-p="x"]         .picon { color: #17140f; background: rgb(23 20 15 / .07); }
.pcard[data-p="facebook"]  .picon { color: #0f5fc0; background: rgb(15 95 192 / .1); }
.pcard[data-p="threads"]   .picon { color: #17140f; background: rgb(23 20 15 / .07); }
.pcard[data-p="instagram"] .picon { color: #b31a53; background: rgb(194 29 90 / .1); }
.pcard[data-p="tiktok"]    .picon { color: #17140f; background: rgb(23 20 15 / .07); }
.pcard[data-p="youtube"]   .picon { color: #b21b23; background: rgb(196 30 39 / .1); }
.pcard[data-p="pinterest"] .picon { color: #9c0e1f; background: rgb(168 15 34 / .1); }
.pcard[data-p="pornhub"]   .picon { color: #a75a05; background: rgb(201 106 6 / .12); }
.pcard[data-p="kwai"]      .picon { color: #c33a14; background: rgb(224 67 26 / .13); }
.pcard[data-p="spotify"]   .picon { color: #12833c; background: rgb(29 185 84 / .14); }
.pcard[data-p="soundcloud"] .picon { color: #d1400f; background: rgb(255 68 0 / .13); }
.pcard[data-p="reddit"]    .picon { color: #d63b00; background: rgb(255 69 0 / .13); }

/* The five HLS platforms and very few others. Same criterion as the rest: the
   brand colour, darkened just enough for the glyph to reach 3:1 over the icon's
   background. Loom's is the only one with a white `--accent-ink`, because its
   violet is light in itself. */
.pcard[data-p="vimeo"]      .picon { color: #0d7d9e; background: rgb(26 183 234 / .18); }
.pcard[data-p="streamable"] .picon { color: #0a6f8c; background: rgb(15 155 196 / .18); }
.pcard[data-p="rutube"]     .picon { color: #b36500; background: rgb(255 140 0 / .16); }
.pcard[data-p="bilibili"]   .picon { color: #c93d68; background: rgb(251 114 153 / .16); }
.pcard[data-p="loom"]       .picon { color: #4640c9; background: rgb(98 93 245 / .14); }

:root[data-theme="dark"] .pcard[data-p="dailymotion"] .picon { color: #f2ede4; background: rgb(242 237 228 / .1); }
:root[data-theme="dark"] .pcard[data-p="snapchat"] .picon { color: #ffe95c; background: rgb(255 252 0 / .14); }
:root[data-theme="dark"] .pcard[data-p="ok"] .picon { color: #e28a45; }
:root[data-theme="dark"] .pcard[data-p="bluesky"] .picon { color: #63b4ff; }
:root[data-theme="dark"] .pcard[data-p="x"] .picon { color: #f2ede4; background: rgb(242 237 228 / .1); }
:root[data-theme="dark"] .pcard[data-p="facebook"] .picon { color: #6ba7f5; }
:root[data-theme="dark"] .pcard[data-p="threads"] .picon { color: #f2ede4; background: rgb(242 237 228 / .1); }
:root[data-theme="dark"] .pcard[data-p="instagram"] .picon { color: #e2709c; }
:root[data-theme="dark"] .pcard[data-p="tiktok"] .picon { color: #f2ede4; background: rgb(242 237 228 / .1); }
:root[data-theme="dark"] .pcard[data-p="youtube"] .picon { color: #e27177; }
:root[data-theme="dark"] .pcard[data-p="pinterest"] .picon { color: #e06a78; }
:root[data-theme="dark"] .pcard[data-p="pornhub"] .picon { color: #e0a35c; }
:root[data-theme="dark"] .pcard[data-p="kwai"] .picon { color: #f2805c; }
:root[data-theme="dark"] .pcard[data-p="spotify"] .picon { color: #4ed184; }
:root[data-theme="dark"] .pcard[data-p="soundcloud"] .picon { color: #ff6a3d; }
:root[data-theme="dark"] .pcard[data-p="reddit"] .picon { color: #ff7a45; }

:root[data-theme="dark"] .pcard[data-p="vimeo"]      .picon { color: #4fc9f5; background: rgb(26 183 234 / .16); }
:root[data-theme="dark"] .pcard[data-p="streamable"] .picon { color: #45b8da; }
:root[data-theme="dark"] .pcard[data-p="rutube"]     .picon { color: #ffa73d; }
:root[data-theme="dark"] .pcard[data-p="bilibili"]   .picon { color: #fd96b2; }
:root[data-theme="dark"] .pcard[data-p="loom"]       .picon { color: #8b87f8; }

.pinfo { display: grid; min-width: 0; align-content: center; }

.pname {
  font-size: var(--t-body);
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Long names: "Dailymotion" and "SoundCloud" do not fit in one piece on the
   two-column card —"Dailymot…", "SoundCl…"— and making the letter smaller only
   lengthens the truncation. Here they are allowed to break onto two lines with a
   hyphen, which is what reads well in a space that short.

   Two classes on purpose: the container query and the mobile version set
   `.pname { font-size }` again further down the file, and with a single class
   they would not win. Two classes beat one regardless of order. */
.pname.pname--long {
  white-space: normal;
  overflow: visible;
  line-height: 1.12;
  hyphens: auto;
  overflow-wrap: break-word;
}

/* Narrow rail: the card compacts instead of leaving the name cut in half. */
@container rail (max-width: 300px) {
  .pcard { grid-template-columns: 30px minmax(0, 1fr); padding: 10px 11px; gap: 2px var(--s-2); }
  .picon { width: 30px; height: 30px; }
  .picon svg { width: 16px; height: 16px; }
  .pname { font-size: 14px; }
  .pkinds li { width: 17px; height: 17px; }
  .pkinds svg { width: 10px; height: 10px; }
  .platforms-title { font-size: 11px; }
}

.pkinds {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s-1);
  margin: var(--s-1) 0 0;
  padding: 0;
  list-style: none;
}

.pkinds li {
  display: grid;
  place-items: center;
  width: 19px;
  height: 19px;
  color: var(--text-3);
  background: var(--card-2);
  border-radius: var(--r-1);
}

.pkinds svg { width: 11px; height: 11px; }


/* The detected platform is highlighted: a coloured border and an opaque veil of
   the brand colour inside the card. The icon stays as it is. */







/* The platform card gets tighter on a phone. It is here, after the `.pcard`
   base rule and not with the rest of the mobile version, for an ordering
   reason: with the same specificity the one that comes later wins, and the base
   is further down the file. */
@media (max-width: 720px) {
  /* Seven rows of two are plenty tall already, so the padding is trimmed and the
     name takes over. */
  .pcard {
    grid-template-columns: 26px minmax(0, 1fr);
    gap: 2px var(--s-2);
    padding: 7px 9px;
  }

  .picon { width: 26px; height: 26px; }
  .picon svg { width: 15px; height: 15px; }
  .pname { font-size: 13px; }
  .pkinds { margin-top: 2px; }
  .pkinds li { width: 15px; height: 15px; }
  .pkinds svg { width: 9px; height: 9px; }
}

/* -------------------------------------------------------- 7 compositor -- */
.hero {
  display: grid;
  gap: var(--s-4);
  padding: var(--s-6);
  border: 1px solid var(--line);
  border-radius: var(--r-3);
  /* Background and border are in the glass rule, further up. */
}

.hero h1 {
  margin: 0;
  font-size: var(--t-display);
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.15;
}

/* `balance` splits the sentence into two similar lines: on narrow screens
   "video, audio or photo." would be left alone and look badly broken. */
.sub {
  margin: calc(-1 * var(--s-2)) 0 0;
  font-size: var(--t-sub);
  color: var(--text-2);
  text-wrap: balance;
}

/* Confirmation of the detected platform. */
.detect {
  display: none;
  align-items: center;
  gap: 6px;
  justify-self: start;
  margin-top: calc(-1 * var(--s-2));
  padding: 3px 10px 3px 7px;
  font-size: var(--t-micro);
  font-weight: 500;
  color: var(--text-2);
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
}

/* The detected platform's chip. It lights up and goes out, and before it went
   from not existing to existing all at once. Now it comes in with the opacity
   and a short `scale`, from .9 to 1: coming out of nothing, a short scaling
   reads as unfolding rather than as growing. */
.detect[data-on="true"] {
  display: inline-flex;
  animation: chipEntra var(--d-3) var(--ease-out) both;
}

@keyframes chipEntra {
  from { opacity: 0; transform: scale(.9) translateY(2px); }
  to   { opacity: 1; transform: none; }
}

.detect svg { width: 13px; height: 13px; color: var(--accent); }

.form { display: grid; gap: var(--s-3); }

/* The link field has no border: just the padding and the corners. Neither has
   the `input` inside it (further down). What marks focus is a ring on the
   inside, so that while typing it looks just as clear without going back to
   looking like a box at rest. */
.field {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  height: 56px;
  padding-inline: var(--s-3) 6px;
  background: var(--card-2);
  border: 0;
  border-radius: var(--r-2);
  transition: box-shadow var(--d-2) var(--ease);
}

.field:focus-within { box-shadow: var(--ring), inset 0 0 0 1.5px var(--accent); }
.field > svg { flex: none; width: 17px; height: 17px; color: var(--text-3); }

/* Two states the script has been writing all along and nothing was reading: the
   border went round on a drag, and a link the resolver will not take came back the
   same as a link still being read. `data-invalid` is set before the request and
   again when it fails, so the order matters: the focused rule above would
   otherwise win, since it is the same specificity and comes first. */
.field[data-drop="true"] { box-shadow: var(--ring), inset 0 0 0 1.5px var(--accent-ink); }
.field[data-invalid="true"] { box-shadow: var(--ring), inset 0 0 0 1.5px var(--err); }

/* All of this is only for the link field, so it is scoped to `.field`: a bare
   tag selector also reached the volume `input[type=range]` and gave it
   `flex: 1` and `width: 0`, which is exactly the opposite of what a slider
   wants. */
.field input {
  flex: 1;
  min-width: 0;
  /* `width: 0` does not show: with `flex: 1` the field still takes up all the
     space left over. Without this, an `<input>`'s own minimum width (about
     200 px by default `size`) became `.field`'s minimum width, and since
     `.hero` cannot shrink below its content, at 360 px the card overflowed the
     screen instead of squeezing the field. */
  width: 0;
  height: 100%;
  padding: 0;
  font: inherit;
  font-size: 17px;
  color: var(--text-1);
  background: none;
  border: 0;
  /* The input does not draw its own focus ring: the global `:focus-visible` rule
     puts one on everything, and on top of `.field`'s ring that gave two
     concentric halos. The container already warns, with `:focus-within`. */
  box-shadow: none;
  border-radius: 0;
  outline: none;
  appearance: none;
}

.field input::placeholder { color: var(--text-3); }

.paste, .clear {
  display: grid;
  place-items: center;
  flex: none;
  width: 40px;
  height: 40px;
  color: var(--text-3);
  border-radius: var(--r-1);
  transition: color var(--d-1), background-color var(--d-1);
}

.paste svg, .clear svg { width: 16px; height: 16px; }

.clear { visibility: hidden; opacity: 0; transition: opacity var(--d-1), color var(--d-1), background-color var(--d-1); }
.field[data-filled="true"] .clear { visibility: visible; opacity: 1; }

@media (hover: hover) {
  .paste:hover, .clear:hover { color: var(--text-1); background: var(--card-3); }
  .clear:hover { color: var(--err); }
}

.form-actions { display: flex; align-items: stretch; gap: var(--s-2); }

.views {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: var(--r-2);
}

.view {
  display: grid;
  place-items: center;
  width: 42px;
  height: 100%;
  min-height: 42px;
  color: var(--text-3);
  border-radius: calc(var(--r-2) - 3px);
  transition: color var(--d-1) var(--ease), background-color var(--d-1) var(--ease), transform var(--d-1) var(--ease);
}

.view svg { width: 18px; height: 18px; }

/* The active view's button. Background and colour come in with `--d-1`, which is
   what a state change within the same bar needs: with the long duration it looked
   like it was lagging. The `transform` is separate, in the pressed state, further
   down. */
.view.is-on {
  color: var(--text-1);
  background: var(--card);
  /* `--shadow-float`, and it used to say `--shadow-1`, which is not defined in
     either theme. A `var()` with no fallback and no value makes the whole
     declaration invalid at computed-value time, so this one was not "a wrong
     shadow": it was no shadow, and the active view button had no lift at all. */
  box-shadow: var(--shadow-float);
  animation: viewEntra var(--d-2) var(--ease-out) both;
}

@keyframes viewEntra {
  from { opacity: .55; transform: scale(.94); }
}

@media (hover: hover) { .view:not(.is-on):hover { color: var(--text-1); } }

.primary, .all {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  /* Without this the loading spinner overlaps the text: `.primary` is flex and
     its children ended up flush, so "Download" came out as "⟳Download". */
  gap: var(--s-2);
  overflow: hidden;
  min-height: 50px;
  padding-inline: var(--s-5);
  font-size: var(--t-body);
  font-weight: 600;
  letter-spacing: -.01em;
  border-radius: var(--r-2);
  /* The `transform` is in the transition because pressing the button sinks it.
     That is what confirms a touch with a finger: colour only takes time, the sink
     is instant.

     The `filter` is there because `.primary`'s hover is a `brightness` and,
     without this, it was outside the transition: the button changed brightness in
     one go, which is a flash. Here the filter is cheap, because the button is a
     flat colour and there is nothing behind it to recompute. */
  transition: transform var(--d-1) var(--ease), background-color var(--d-2) var(--ease), border-color var(--d-2) var(--ease), color var(--d-2) var(--ease), filter var(--d-2) var(--ease);
}

.primary {
  flex: 1;
  color: var(--accent-ink);
  background: var(--accent);
}

/* Pressed: it sinks 2%. With `box-shadow` you barely notice, because the `inset`
   shadow is the same order as the outer one. With `scale` the finger sees that
   the button gave way, which is exactly what happens on iOS.

   `will-change` goes HERE and not in the rule above, on purpose. Put on the base,
   every button on the page would have its own compositor layer forever: on a
   screen with the bar, the field, two buttons, the switch, eight items and their
   buttons that comes to twenty layers, and each one is memory the browser holds
   onto even when nothing is animating. Here it is only alive while the finger is
   down, and the layer is dropped right after. Put on `:active` it lasts as long
   as the finger does, which is when being prepared actually matters. */
.primary:active,
.all:active,
.view:active,
.paste:active,
.clear:active {
  transform: scale(.97);
  will-change: transform;
}

.primary:active,
.all:active { box-shadow: var(--shadow-press); }

.all {
  color: var(--text-1);
  background: var(--card-2);
  border: 1px solid var(--line-2);
}

.all svg { width: 16px; height: 16px; }

@media (hover: hover) {
  .primary:hover { filter: brightness(1.12); }
  .all:hover { background: var(--card-3); }
}

.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid color-mix(in srgb, currentColor 32%, transparent);
  border-top-color: currentColor;
  border-radius: 50%;
  animation: spin 700ms linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.ripple {
  position: absolute;
  border-radius: 50%;
  background: color-mix(in srgb, currentColor 26%, transparent);
  transform: scale(0);
  animation: ripple 550ms var(--ease) forwards;
  pointer-events: none;
}

@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* --------------------------------------------------------- 8 shortcuts -- */
.panel-keys {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  /* Background and border are in the glass rule. */
}

.panel-keys h2 { margin: 0 0 var(--s-1); }

.keys { display: grid; margin: 0; }

/* Each row is a two-column grid: the keys do not stretch and the text can take
   whatever is left over without pushing the next row. */
.keys-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-2) 0;
}

.keys-row + .keys-row { border-top: 1px solid var(--line); }
.keys-row:first-child { padding-top: var(--s-1); }
.keys-row:last-child { padding-bottom: 0; }

.keys dt {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  justify-content: flex-end;
  min-width: 74px;
}

.keys dd {
  margin: 0;
  font-size: var(--t-sub);
  font-weight: 500;
  color: var(--text-2);
  text-wrap: balance;
}

/* ------------------------------------------------------------- 9 items -- */
.status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  margin: 0;
  text-align: center;
  font-size: var(--t-sub);
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text-3);
}

/* The message changes text and you have to notice. The JavaScript removes and
   re-adds `data-swap` in the same instant to restart the animation, because
   otherwise the browser would skip it: it only fires when the value changes.
   That attribute had been there from before with no rule looking at it, so the
   message appeared and vanished abruptly.

   `--d-1` on purpose: it is a one-line message, and at this point making it
   slower reads as the page stalling. */
.status[data-swap] {
  animation: statusEntra var(--d-1) var(--ease-out) both;
}

@keyframes statusEntra {
  from { opacity: 0; transform: translateY(3px); }
}

/* The same fade for the view change. The JavaScript removes and re-adds the
   attribute in the same instant, and that forced reflow of the width is what
   makes the animation start over: if the attribute were set only once, the
   browser would skip it on the second consecutive change.

   `.feed` is in the selector on purpose, and not for looks. Without it this rule
   and `:root[data-boot] .post` —which turns off the items' entry during the
   first two frames— tie on specificity, and since the second is further down the
   stylesheet it would win and the fade would not be seen. With `.feed` in
   between this always wins, without depending on `data-boot` already having been
   removed. */
.layout[data-swap] .feed .post,
.layout[data-swap] .post.shimmer {
  animation: vistaCambia var(--d-2) var(--ease-in-out) both;
}

@keyframes vistaCambia {
  from { opacity: 0; transform: translateY(4px); }
}

.status:empty { display: none; }

.hero .status { margin-top: calc(-1 * var(--s-1)); }
.status.busy { color: var(--text-2); }
.status.ok { color: var(--ok); }
.status.error { color: var(--err); }

.feed { display: grid; gap: var(--s-3); }

/* Carousel view: one item full screen, TikTok style, with snapping and arrows
   to move to the next. */
.layout[data-view="carousel"] .window-body {
  overflow: hidden;
  /* More margin than in list. The carousel item takes up almost the whole window,
     and with the usual 16 px what you see is a photo with a token margin around
     it; with 20 you see a card inside a window. */
  padding: 20px;
}

.layout[data-view="carousel"] .feed {
  display: flex;
  gap: var(--s-3);
  height: 100%;
  min-height: 0;
  overflow-x: auto;
  /* No `overscroll-behavior: contain` here: on reaching the end the gesture has
     to carry on into the page's scroll. With `contain` the finger stopped dead at
     the end of the carousel and it looked like nothing was responding. */
  scroll-snap-type: x mandatory;
  scroll-padding-inline: var(--s-3);
  scrollbar-width: none;
}

.layout[data-view="carousel"] .feed::-webkit-scrollbar { width: 0; height: 0; display: none; }

.layout[data-view="carousel"] .post {
  flex: 0 0 100%;
  grid-template-areas: "media" "head" "foot";
  grid-template-columns: 1fr;
  /* The image row keeps whatever is left over from the window. */
  grid-template-rows: minmax(0, 1fr) auto auto;
  gap: var(--s-3);
  align-content: stretch;
  min-height: 0;
  height: 100%;
  scroll-snap-align: start;
  padding: 0;
  /* In the carousel the item goes with NO background, as it was: the photo leads
     and a tint layer on top killed it. The glass comes from the window, which
     does have it, so taking it off the item does not lose the effect —it just
     gives the photo back clean inside the glass window. That is why this carries
     neither `box-shadow` nor tint: the edge comes from the window. */
  background: none;
  border: 0;
  box-shadow: none;
  animation: none;
}

/* The photo stays full bleed, which is what a carousel is, but the TEXT does
   not. With the item at `padding: 0` the platform name and the file name lined
   up exactly with the window's edge and read as stuck to it, with no separation
   at all. Here they alone get breathing room: the image still touches the edges
   and the text moves in. */
.layout[data-view="carousel"] .post-head,
.layout[data-view="carousel"] .post-foot {
  padding-inline: var(--s-4);
}

.layout[data-view="carousel"] .post:hover { background: none; }

.layout[data-view="carousel"] .post::after { display: none; }

/* The image takes whatever window is left without being cropped. */
.layout[data-view="carousel"] .media {
  aspect-ratio: auto;
  min-height: 0;
  border-radius: var(--r-2);
}

.layout[data-view="carousel"] .media video,
.layout[data-view="carousel"] .media img { object-fit: contain; }

.layout[data-view="carousel"] .media--audio { min-height: 160px; }

.layout[data-view="carousel"] .post-foot { flex-wrap: wrap; }

/* No `flex: 1`: the button keeps the width of its label and it is the text that
   shrinks. If it stretched, the `min-width: max-content` further down would leave
   it with an empty gap on the right that adds nothing.

   The `margin-bottom` separates the button from the bottom edge. The carousel
   `.post` has `padding: 0` and is the grid's last row, so without this the
   button sat right on the window's border. It goes on the button rather than as
   `padding-bottom` on `.post-foot` because the footer has `flex-wrap: wrap`, and
   on a wrapped row the margin travels with the button instead of leaving the gap
   stuck to the edge, which is exactly what is being avoided. */
.layout[data-view="carousel"] .post-foot .primary {
  min-height: 46px;
  margin-bottom: var(--s-3);
}

/* The arrows only exist in carousel. */
.nav {
  position: absolute;
  top: 50%;
  z-index: 2;
  display: none;
  place-items: center;
  width: 38px;
  height: 38px;
  color: var(--text-1);
  background: color-mix(in srgb, var(--card) 82%, transparent);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line-2);
  border-radius: 50%;
  box-shadow: var(--shadow-float);
  transform: translateY(-50%);
  transition: color var(--d-1), background-color var(--d-1), opacity var(--d-2) ;
}

.nav svg { width: 18px; height: 18px; }
.nav--prev { left: 10px; }
.nav--next { right: 10px; }

/* On small content widths the arrows shrink a little: otherwise they eat half
   the thumbnail. */
@container win (max-width: 420px) {
  .nav { width: 34px; height: 34px; }
  .nav svg { width: 16px; height: 16px; }
  .nav--prev { left: 6px; }
  .nav--next { right: 6px; }
}

.layout[data-view="carousel"] .nav { display: grid; }



@media (hover: hover) { .nav:hover { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); } }

/* The controls only exist when there are real items. The condition is
   `results` and not "anything that is not idle": while the API is answering the
   state is `loading`, and with the previous rule the arrows and the footer showed
   up as soon as Download was pressed, with the list still empty. During the wait
   the only thing visible is the skeleton, and the skeleton is not removed until
   the data arrives.
   It goes after the carousel rule because otherwise that one would override it
   and the arrows would come out with no items. */
.layout:not([data-state="results"]) .window-foot,
.layout:not([data-state="results"]) .nav { display: none; }


.post {
  position: relative;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  grid-template-areas: "media head" "media foot";
  gap: var(--s-2) var(--s-3);
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-2);
  animation: rise var(--d-4) var(--ease-out) both;
  /* Hover moves the card with `transform` and not with `box-shadow`. The shadow
     gets painted: with eight items on screen each one repaints on hover, and
     with the box moving a pixel the cost belongs to the compositor. Colour and
     transform are cheap, and it shows. */
  transition: transform var(--d-2) var(--ease), border-color var(--d-2) var(--ease), background-color var(--d-2) var(--ease);
  overflow: hidden;
  /* Inner items: they go in glass and with MORE tint than the window, which is
     what sets them on top instead of leaving them floating behind. The border and
     the shine come from the glass rule, and they are what give the edge; without
     them the tint bleeds against the window and you cannot see where the card
     ends. */
  background: var(--cristal-item);
  backdrop-filter: var(--cristal-filtro);
  -webkit-backdrop-filter: var(--cristal-filtro);
  box-shadow:
    inset 0 1px 0 var(--cristal-luz),
    0 1px 2px var(--cristal-sombra);
}

.post { border-color: var(--cristal-borde); }

@media (hover: hover) {
  .post:hover {
    border-color: var(--cristal-borde);
    background: var(--cristal-hover);
    transform: translateY(var(--lift));
  }
  /* And on leaving it goes back with nothing more: `transform` is set to `none`
     so no displacement is left applied to a card the pointer is no longer
     over. */
  .post:not(:hover) { transform: none; }
}

/* Downloading: a progress line under the row. */
.post:has(.primary:disabled)::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 40%;
  height: 2px;
  background: var(--accent);
  animation: sweep 1100ms var(--ease) infinite;
}

@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

/* An item's entry. It used to be six pixels of rise and little else, which read
   as a flicker. Now besides rising it also sharpens a little: `scale` starts at
   .985 and reaches 1, so the card settles into place instead of materialising on
   top. Both go in the same `transform` so the browser composes them into one
   layer instead of two. */
@keyframes rise {
  from { opacity: 0; transform: translateY(10px) scale(.985); }
}

.post-head { grid-area: head; display: flex; align-items: center; gap: var(--s-2); min-width: 0; }

.avatar {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  color: var(--text-2);
  background: var(--card-3);
  border-radius: 50%;
}

.avatar svg { width: 13px; height: 13px; }
.name { font-size: var(--t-body); font-weight: 600; }
.sub { font-size: var(--t-micro); letter-spacing: .06em; text-transform: uppercase; }
.idx { margin-left: auto; font-family: var(--font-mono); font-size: var(--t-micro); color: var(--text-3); }

.media {
  position: relative;
  grid-area: media;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--card-3);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line-2) 60%, transparent);
  border-radius: var(--r-1);
}

.media video, .media img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* Photos are not cropped. `cover` on a square frame eats the sides of a portrait
   and the top and bottom of a panorama, which is exactly what one came to look
   at. With `contain` it is seen whole and the background makes a frame. The
   carousel already used `contain`; here too, since the photo is the thing that
   can least afford to lose a piece. */
.media--photo img { object-fit: contain; }

/* video.js with its factory skin: it is only fitted to the thumbnail's frame,
   because its fluid mode reserves the height with padding-top and would throw
   the card out of alignment. The controls' position is video.js's own. */
.media .video-js,
.media .video-js.vjs-fluid:not(.vjs-user-reset) {
  padding-top: 0;
  width: 100%;
  height: 100%;
  font-size: 11px;
}

.media .video-js .vjs-tech { object-fit: contain; }

.media .video-js .vjs-poster { background-size: cover; }

/* ── @videojs/themes skins ──
   All four are hand-written and outdated (2020, for video.js 7), so they leave
   things broken for this particular case. Only that is fixed here.

   Every selector has `.media .video-js` in front on purpose: the skin stylesheets
   are inserted at the end of the head, after this one, so with equal specificity
   their rule wins. Putting the ancestor in front wins even if the sheet arrives
   late, and there is no need to fight with `!important`. */

/* 1. They remove controls. `city` and `forest` hide the mute button and `sea`
   hides the whole volume panel. On desktop it comes back on hover, but on a
   phone the panel only appears on tap: with `sea` there would be no way to
   change the volume with a finger, which is exactly where it matters most. */
.media .video-js.vjs-theme-city .vjs-mute-control,
.media .video-js.vjs-theme-forest .vjs-mute-control,
.media .video-js.vjs-theme-sea .vjs-volume-panel { display: flex; }

/* And the volume panel opens on touch, not only on hover: without this it is
   still unreachable with a finger. */
.media .video-js .vjs-volume-panel { display: none; }
.media .video-js .vjs-volume-control:hover .vjs-volume-panel,
.media .video-js .vjs-volume-control:focus-within .vjs-volume-panel,
.media .video-js .vjs-volume-panel.vjs-volume-panel-active { display: flex; }

/* 2. The play buttons they ship are 88 and 103 px against thumbnails of
   96-132 px: the button covers the whole video. They are brought down to a size
   that looks good in both views without eating the frame. */
.media .video-js.vjs-theme-forest .vjs-big-play-button { width: 52px; height: 52px; margin-top: -26px; margin-left: -26px; background-size: 52px 52px; }
.media .video-js.vjs-theme-sea .vjs-big-play-button { width: 62px; height: 48px; margin-top: -24px; margin-left: -31px; border-radius: 24px; }
.media .video-js.vjs-theme-fantasy .vjs-big-play-button { width: 52px; height: 52px; margin-top: -26px; margin-left: -26px; }

/* 3. `city` sets a 70 px bar with 20 px of padding: more than half of a 132 px
   thumbnail, and nearly all of a 96 px one. */
.media .video-js.vjs-theme-city .vjs-control-bar { height: 34px; padding-top: 0; }
.media .video-js.vjs-theme-city .vjs-button > .vjs-icon-placeholder:before { line-height: 1.55; }
.media .video-js.vjs-theme-city .vjs-time-control { line-height: 34px; }
.media .video-js.vjs-theme-city .vjs-progress-control { height: 12px; }
.media .video-js.vjs-theme-city .vjs-progress-holder { top: 6px; }
.media .video-js.vjs-theme-forest .vjs-control-bar { margin-bottom: 0; padding-left: 4px; padding-right: 4px; }
.media .video-js.vjs-theme-sea .vjs-control-bar { height: 34px; }
.media .video-js.vjs-theme-sea .vjs-time-control { line-height: 34px; }
.media .video-js.vjs-theme-sea .vjs-play-progress { background-color: var(--accent); }
.media .video-js.vjs-theme-sea .vjs-progress-control .vjs-slider { background-color: var(--accent-soft); }
.media .video-js.vjs-theme-sea .vjs-load-progress div { background-color: var(--line-2); }

/* 4. Each skin ships its own fixed colour (green, red, blue). All of them expose
   the colour as a variable, so it is replaced with the detected platform's and
   the skin stops clashing with the rest of the page. */
.media .video-js.vjs-theme-city   { --vjs-theme-city--primary: var(--accent); --vjs-theme-city--secondary: var(--accent-ink); }
.media .video-js.vjs-theme-forest { --vjs-theme-forest--primary: var(--accent); --vjs-theme-forest--secondary: var(--accent-ink); }

/* While the API has not answered, the thumbnail looks like a loading hole.

   The descendant, not the box: the attribute is written on the `<video>`/`<img>`
   itself, which is a child of `.media` (see the `.media video, .media img` rule
   above), so `.media[data-loading]` never matched and the hole was never painted.
   Four writes of the attribute in the script had no reader at all. */
.media [data-loading="true"] { background: var(--card-3); }




/* ── audio player ──
   The browser's native control ("▶ 0:00 / 0:12" with its grey bar) clashes with
   the rest of the page and spends 40 px saying very little. This is a custom one
   instead: play button, the waveform turned into a progress bar, the time and the
   volume. The `<audio>` stays underneath, without `controls`: it is the engine,
   not the view. */
.media--audio {
  position: relative;
  display: grid;
  align-content: center;
  min-height: 132px;
  padding: var(--s-4);
  aspect-ratio: auto;
  background: var(--card-2);
  box-shadow: none;
}

.media--audio audio { display: none; }

/* In the carousel the thumbnail row is `1fr`, meaning the audio box stretched to
   the full available height and sat half empty around a hundred-pixel player.
   Here the box is sized to what it measures and centred in the gap: better a
   block with air on both sides than a huge rectangle with something small inside
   it. */
.layout[data-view="carousel"] .media--audio { align-self: center; min-height: 0; }

.player {
  display: grid;
  /* Waveform on top, controls in a single row below. The waveform and the volume
     used to be stacked in two rows, and with both having the same line shape they
     read as two progress bars. */
  grid-template-rows: auto auto;
  gap: var(--s-4);
  width: 100%;
}

.player-track {
  position: relative;
  height: 64px;
  cursor: pointer;
  touch-action: manipulation;
}

.player-wave {
  display: flex;
  align-items: center;
  gap: 3px;
  width: 100%;
  height: 100%;
}

.player-wave i {
  flex: 1;
  /* `min-width: 1px` is not decorative: with 40 bars and 3 px of gap, a narrow
     box leaves exactly that space and the gaps eat it all. Without this the bars
     reach 0 px and the waveform disappears. */
  min-width: 1px;
  min-height: 4px;
  background: var(--line-2);
  border-radius: var(--r-pill);
  transition: background-color var(--d-1) linear;
}

.player-wave i[data-on="true"] { background: var(--accent); }

/* The playhead is light with a dark border: the other way round it got lost,
   because exactly where it goes is where the dark bars meet the light ones, and a
   dot the same colour as its surroundings was not visible. */
.player-thumb {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  background: var(--accent-ink);
  border: 2.5px solid var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: box-shadow var(--d-1) ;
}

@media (hover: hover) {
  .player-track:hover .player-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
}

.player-track:focus-visible { box-shadow: var(--ring); border-radius: var(--r-1); }
.player-track:focus-visible .player-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }

/* A single row of controls: play, the time and the volume. All on the same line
   with the volume on the right. */
.player-bar {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}

.player-btn {
  display: grid;
  place-items: center;
  flex: none;
  width: 44px;
  height: 44px;
  color: var(--accent-ink);
  background: var(--accent);
  border-radius: 50%;
  transition: transform var(--d-1) var(--ease), background-color var(--d-3) var(--ease);
}

.player-btn:active { transform: scale(.93); }
.player-btn svg { width: 19px; height: 19px; }

/* One button, two icons: the state lives in the box's `data-playing`, so there
   is nothing to keep in sync by hand from the JS. */
.player-play .i-pause { display: none; }
.media--audio[data-playing="true"] .player-play .i-play { display: none; }
.media--audio[data-playing="true"] .player-play .i-pause { display: block; }

/* Fixed-width figures: if the 1 takes up less than the 8, the time jumps sideways
   every second. */
.player-time {
  font-family: var(--font-mono);
  font-size: var(--t-sub);
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
  white-space: nowrap;
}

.player-time i { font-style: normal; color: var(--text-3); }

.player-vol {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  margin-left: auto;
}

.player-mute {
  display: grid;
  place-items: center;
  flex: none;
  width: 32px;
  height: 32px;
  color: var(--text-3);
  border-radius: var(--r-1);
  transition: color var(--d-1), background-color var(--d-1);
}

.player-mute svg { width: 18px; height: 18px; }
.player-mute .i-muted { display: none; }
.media--audio[data-muted="true"] .player-mute .i-volume { display: none; }
.media--audio[data-muted="true"] .player-mute .i-muted { display: block; }

@media (hover: hover) {
  .player-mute:hover { color: var(--text-1); background: var(--card-3); }
}

/* The volume is a native `input[type=range]`, restyled: keyboard and
   accessibility come free and it works with a finger with no extra code. */
.player-volume {
  width: 84px;
  height: 20px;
  margin: 0;
  background: none;
  appearance: none;
  cursor: pointer;
}

.player-volume::-webkit-slider-runnable-track {
  height: 4px;
  background: var(--line-2);
  border-radius: var(--r-pill);
}

.player-volume::-moz-range-track {
  height: 4px;
  background: var(--line-2);
  border-radius: var(--r-pill);
}

.player-volume::-webkit-slider-thumb {
  width: 14px;
  height: 14px;
  margin-top: -5px;
  background: var(--accent);
  border: 2px solid var(--card-2);
  border-radius: 50%;
  appearance: none;
}

.player-volume::-moz-range-thumb {
  width: 14px;
  height: 14px;
  background: var(--accent);
  border: 2px solid var(--card-2);
  border-radius: 50%;
}

.player-volume:focus-visible { box-shadow: var(--ring); border-radius: var(--r-1); }

/* In the window the audio is a cover: the song's background photo, blurred and
   at half opacity, the button in the centre and the time below. No waveform and
   no volume: that is what is expected of a player of this kind. */
.layout[data-view="carousel"] .media--audio {
  display: grid;
  align-content: center;
  justify-items: center;
  min-height: 190px;
  padding: var(--s-5);
  /* `isolation` bounds the negative `z-index`: the cover and the veil stay behind
     the player and do not slip behind the card. */
  isolation: isolate;
  background: var(--card-3);
}

/* The cover, blurred and large so the blur does not show its edges. You can
   make out the song's colour without stealing room from the button. */
.player-cover {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(24px) saturate(1.3);
  opacity: .55;
  transform: scale(1.18);
}

/* The veil: it guarantees contrast for the button and the time, whatever the
   cover looks like. Without this, a light photo left white text on white. It is
   on the base and not only in the carousel because the list thumbnail uses the
   same cover. */
.media--audio::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--card-3);
  opacity: .45;
}

.layout[data-view="carousel"] .player {
  grid-template-rows: auto;
  justify-items: center;
}

.layout[data-view="carousel"] .player-track,
.layout[data-view="carousel"] .player-vol { display: none; }

/* Column: button on top, time below. */
.layout[data-view="carousel"] .player-bar {
  flex-direction: column;
  justify-content: center;
  gap: var(--s-3);
}

.layout[data-view="carousel"] .player-btn { width: 64px; height: 64px; }
