  /* Highlights the detected platform's card. It is marked here and not with CSS
     because CSS cannot compare the value of `data-platform` with that of each
     card's `data-p`, and doing it with rules meant adding one per platform:
     there were fourteen identical copies. */
  for (const card of document.querySelectorAll(".pcard[data-p]")) {
    card.toggleAttribute("data-active", Boolean(platform) && card.dataset.p === platform);
  }

  if (!detectTag) return;

  detectTag.dataset.on = String(Boolean(platform));
  detectTag.replaceChildren();

  if (platform) {
    detectTag.append(icon(platform, 13), document.createTextNode(BRAND[platform] ?? platform));
  }
}

function sync() {
  const platform = detect(input.value);
  tint(platform);
  field.dataset.invalid = "false";
  field.dataset.filled = String(Boolean(input.value.trim()));

  /* The link is not judged here. Before, if the platform was not recognised, an
     error jumped out while you were typing, and with the universal extractor that
     is no longer true: a link from any site is not broken, the universal will
     resolve it. The verdict comes from the response, not from what has been
     typed —which, in a half-typed URL, always looks like nobody recognises it—. */
  if (!input.value.trim()) setStatus("");
}

/** Goes back to the initial UI: no input, no results and no state. */
function reset() {
  input.value = "";
  field.dataset.filled = "false";
  field.dataset.invalid = "false";
  unmountPlayers(results);
  results.replaceChildren();
  setState("idle");
  setStatus("");
  tint(null);
  lastResult.url = null;
  lastResult.items = [];
  lastResult.platform = null;
  showAll(0);
  input.focus();
}

/* --------------------------------------------------------------- results -- */

/** Minutes and seconds as seen: "3:42", or "1:02:30" if it goes past the hour. */
function clock(seconds) {
  const total = Math.max(0, Math.floor(seconds || 0));
  const hours = Math.floor(total / 3600);
  const rest = total % 3600;

  if (hours > 0) return `${hours}:${String(Math.floor(rest / 60)).padStart(2, "0")}:${String(rest % 60).padStart(2, "0")}`;

  return `${Math.floor(rest / 60)}:${String(rest % 60).padStart(2, "0")}`;
}

/** What the type label says, on the card and in English.
 *
 * It is painted from `kind` and not from the `type` the API sends. `kind` —«video»,
 * «audio», «image»— is a closed key of three values, does not depend on the
 * language and is exactly what is needed to paint; `type`, on the other hand, is
 * free text that other clients also consume, so tying to it ties the card to a
 * word that can change without notice.
 *
 * When the API sent the type in Spanish, this was the translation that avoided a
 * card in Spanish inside a page in English. The server already sends it in
 * English, but the mapping stays: it is what stops a change of text in the API
 * from showing on the card, and it is three lines.
 *
 * `item.type` is only looked at to preserve «HLS», which is not a word but the
 * name of a protocol, and it is written the same in both languages.
 */
const ETIQUETA_TIPO = { video: "Video", audio: "Audio", image: "Image" };
const MARCA_TIPO = new Set(["HLS"]);

function etiquetaTipo(item, type) {
  const name = ETIQUETA_TIPO[type] ?? "File";
  return MARCA_TIPO.has(item.type) ? `${name} · HLS` : name;
}

function buildCard(item, sourceUrl, platform) {
  const type = item.kind ?? (item.isVideo ? "video" : "image");
  const post = document.createElement("article");
  post.className = "post";

  const head = document.createElement("div");
  head.className = "post-head";

  const avatar = document.createElement("span");
  avatar.className = "avatar";
  avatar.append(icon(platform, 16));

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = item.brand;

  const sub = document.createElement("span");
  sub.className = "sub u-label";
  sub.textContent = etiquetaTipo(item, type);

  const idx = document.createElement("span");
  idx.className = "idx";
  idx.textContent = `#${item.index + 1}`;

  head.append(avatar, name, sub, idx);

  let audioPlayer = null;

  const media = document.createElement("div");
  media.className = type === "audio" ? "media media--audio"
    : type === "image" ? "media media--photo"
    : "media";

  if (type === "audio") {
    /* The engine: it is still a real `<audio>`, but without `controls`. From it
       only time, volume and playback are taken; the view is handled by the player
       below. */
    const engine = document.createElement("audio");

    engine.src = fuenteDe(item);
    engine.preload = item.lazy ? "none" : "metadata";
    engine.setAttribute("aria-label", item.title || `audio from ${item.brand}`);
    reportMissing(engine, item);

    const player = document.createElement("div");
    player.className = "player";

    const play = document.createElement("button");
    play.type = "button";
    play.className = "player-btn player-play";
    play.setAttribute("aria-label", "Play");
    play.innerHTML = `<svg class="i-play" viewBox="0 0 24 24" aria-hidden="true">${ICONS.play}</svg>`
      + `<svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true">${ICONS.pause}</svg>`;

    /* The waveform is both the drawing and the position control, so it needs a
       role and focus, and it cannot be left out for the screen reader. */
    const track = document.createElement("div");
    track.className = "player-track";
    track.setAttribute("role", "slider");
    track.setAttribute("tabindex", "0");
    track.setAttribute("aria-label", "Audio position");
    track.setAttribute("aria-valuemin", "0");
    track.setAttribute("aria-valuemax", "100");
    track.setAttribute("aria-valuenow", "0");

    const wave = document.createElement("div");
    wave.className = "player-wave";

    const bars = [];

    for (const height of WAVE) {
      const bar = document.createElement("i");
      bar.style.height = `${height}%`;
      wave.append(bar);
      bars.push(bar);
    }

    const thumb = document.createElement("span");
    thumb.className = "player-thumb";
    track.append(wave, thumb);

    const time = document.createElement("span");
    time.className = "player-time";
    time.innerHTML = "<b>0:00</b> <i>/ --:--</i>";

    const volume = document.createElement("div");
    volume.className = "player-vol";

    const mute = document.createElement("button");
    mute.type = "button";
    mute.className = "player-mute";
    mute.setAttribute("aria-label", "Mute");
    mute.innerHTML = `<svg class="i-volume" viewBox="0 0 24 24" aria-hidden="true">${ICONS.volume}</svg>`
      + `<svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true">${ICONS.muted}</svg>`;

    const slider = document.createElement("input");
    slider.type = "range";
    slider.className = "player-volume";
    slider.min = "0";
    slider.max = "1";
    slider.step = "0.01";
    slider.value = "1";
    slider.setAttribute("aria-label", "Volume");

    volume.append(mute, slider);

    /* Everything actionable on a single line: play, time and volume, separated
     from the waveform so the eye knows where one thing ends and the other
     begins. */
    const bar = document.createElement("div");
    bar.className = "player-bar";

    bar.append(play, time, volume);
    player.append(track, bar);

    const known = () => Number.isFinite(engine.duration) && engine.duration > 0;

    /* Without a duration there is no knowing what part is playing, so until the
       metadata arrives the waveform stays all dark and so does the time. */
    const paint = () => {
      const ratio = known() ? engine.currentTime / engine.duration : 0;
      const lit = Math.round(ratio * bars.length);

      for (const [index, bar] of bars.entries()) bar.dataset.on = String(index < lit);

      thumb.style.left = `${(ratio * 100).toFixed(3)}%`;

      const percent = Math.round(ratio * 100);
      track.setAttribute("aria-valuenow", String(percent));
      track.setAttribute("aria-valuetext", known()
        ? `${clock(engine.currentTime)} of ${clock(engine.duration)}`
        : "unknown position");

      time.innerHTML = `<b>${clock(engine.currentTime)}</b> <i>/ ${known() ? clock(engine.duration) : "--:--"}</i>`;
    };

    const seekTo = (clientX) => {
      if (!known()) return;

      const box = track.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - box.left) / box.width));

      engine.currentTime = ratio * engine.duration;
      paint();
    };

    track.addEventListener("click", (event) => seekTo(event.clientX));

    /* With the keyboard too, otherwise the control is left with only the mouse
       and the finger. The arrows jump five seconds, like in any player, and the
       space bar toggles playback. */
    track.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "k") {
        event.preventDefault();
        toggle();
        return;
      }

      if (!known()) return;

      if (event.key === "Home" || event.key === "End") {
        event.preventDefault();
        engine.currentTime = event.key === "Home" ? 0 : engine.duration;
        paint();
        return;
      }

      const step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[event.key];
      if (step === undefined) return;

      event.preventDefault();
      engine.currentTime = Math.min(engine.duration, Math.max(0, engine.currentTime + step));
      paint();
    });

    /* By taking away the native controls, the volume disappears too: it has to be
       given back or a function that was there before is lost. */
    const toggle = () => {
      if (engine.paused) engine.play().catch(() => {});
      else engine.pause();
    };

    play.addEventListener("click", toggle);

    mute.addEventListener("click", () => {
      engine.muted = !engine.muted;
      if (!engine.muted && Number(engine.volume) === 0) engine.volume = 0.6;
      syncMute();
    });

    slider.addEventListener("input", () => {
      engine.volume = Number(slider.value);
      engine.muted = engine.volume === 0;
      syncMute();
    });

    function syncMute() {
      const silent = engine.muted;
      media.dataset.muted = String(silent);
      mute.setAttribute("aria-label", silent ? "Turn the sound on" : "Mute");
    }

    for (const event of ["play", "pause"]) {
      engine.addEventListener(event, () => {
        media.dataset.playing = String(!engine.paused);
        play.setAttribute("aria-label", engine.paused ? "Play" : "Pause");
      });
    }

    /* On finishing, the waveform goes dark and the button goes back to Play: if
       it were left on Pause at the end, the next press would do nothing. */
    engine.addEventListener("ended", () => {
      engine.currentTime = 0;
      paint();
    });

    for (const event of ["timeupdate", "seeked", "loadedmetadata", "emptied"]) {
      engine.addEventListener(event, paint);
    }

    syncMute();
    paint();

    /* The cover is sent by the server paired with the audio. It goes behind, with
       blur and at half opacity: if there is no photo, the player keeps the box's
       colour and carries on working the same. */
    if (item.cover) {
      const cover = document.createElement("img");
      cover.className = "player-cover";
      cover.src = item.cover;
      cover.alt = "";
      cover.loading = "lazy";
      cover.setAttribute("aria-hidden", "true");
      media.prepend(cover);
    }

    audioPlayer = engine;
    media.append(player, engine);
  } else {
    const preview = document.createElement(type === "video" ? "video" : "img");
    preview.src = fuenteDe(item);
    preview.playsInline = true;
    preview.preload = item.lazy ? "none" : "metadata";

    if (type === "video") {
      preview.controls = true;
      preview.setAttribute("playsinline", "");
      preview.className = "video-js vjs-big-play-centered";
      preview.dataset.player = "videojs";
      preview.dataset.loading = "true";
    } else {
      preview.alt = item.name;
      preview.loading = "lazy";
    }

    reportMissing(preview, item);
    media.append(preview);
  }

  const foot = document.createElement("div");
  foot.className = "post-foot";

  const size = document.createElement("span");
  size.className = "size u-label";
  size.textContent = [item.extension, item.size].filter(Boolean).join(" · ");

  /* The duration is the first thing you want to know about an audio, and it only
     shows up once the browser has read the file's header. It goes between the
     format and the size because that is where you look for it. */
  if (audioPlayer) {
    audioPlayer.addEventListener("loadedmetadata", () => {
      if (!Number.isFinite(audioPlayer.duration) || audioPlayer.duration <= 0) return;

      size.textContent = [item.extension, clock(audioPlayer.duration), item.size]
        .filter(Boolean)
        .join(" · ");
    });
  }

  const save = document.createElement("button");
  save.className = "primary";
  save.type = "button";

  const saveLabel = document.createElement("span");
  saveLabel.textContent = "Download";
  save.append(saveLabel);
  save.addEventListener("click", () => download(item, sourceUrl, save));

  const info = document.createElement("span");
  info.className = "info";
  if (item.title) {
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = item.title;
    title.title = item.title;
    info.append(title, size);
  } else {
    info.append(size);
  }

  foot.append(info, save);
  post.append(head, media, foot);

  return post;
}

const BLOB_LIMIT = 250 * 1024 * 1024;

/** Saves a blob with the file's correct name. */
function saveBlob(blob, name) {
  const href = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = href;
  link.download = name;
  link.rel = "noopener";
  document.body.append(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(href), 8000);
}

/** If the browser's network cannot reach the CDN, it is warned about once. */
/**
 * Videos are mounted with video.js as soon as the API answers. The loading state
 * is only visual (the thumbnail looks hollow) and it is removed as soon as the
 * media brings data, so as not to wait for anything that might never arrive.
 */
function mountPlayer(element) {
  if (!window.videojs || element.dataset.mounted === "true") return;

  element.dataset.mounted = "true";
  delete element.dataset.loading;

  /* The skin is put on before mounting: video.js copies the element's classes to
     its own, so if it were put on afterwards they would have to be looked for. */
  element.classList.add(`vjs-theme-${SKIN_NAME}`);

  window.videojs(element, {
      controls: true,
    preload: element.preload || "none",
    playsinline: true,
    // Only `fluid`: the size is set by the card's thumbnail.
    fluid: true,
    bigPlayButton: true,
    preloadTextTracks: false,
    controlBar: { pictureInPictureToggle: true, fullscreenToggle: true },
  });
}

let videojsReady = null;

/**
 * video.js comes from a CDN with `defer`, so it can arrive after the API has
 * already painted the cards. It waits for it to load and, if it really does not
 * arrive, the video keeps the native controls it already has in the markup.
 */
function whenVideojs() {
  if (window.videojs) return Promise.resolve(window.videojs);
  if (videojsReady) return videojsReady;

  videojsReady = new Promise((resolve) => {
    const script = document.querySelector('script[src*="video.js"]');

    if (!script) return resolve(null);

    script.addEventListener("load", () => resolve(window.videojs ?? null), { once: true });
    script.addEventListener("error", () => resolve(null), { once: true });
  });

  return videojsReady;
}

async function mountPlayers(scope) {
  for (const element of scope.querySelectorAll('video[data-player="videojs"]')) {
    if (element.dataset.mounted === "true") continue;

    // The loading track goes out as soon as there is something to play.
    const done = () => { delete element.dataset.loading; };
    const pronto = { once: true, passive: true };

    element.addEventListener("loadeddata", done, pronto);
    element.addEventListener("canplay", done, pronto);
    element.addEventListener("error", done, pronto);

    if (element.dataset.wait === "true") continue;

    element.dataset.wait = "true";

    const player = await whenVideojs();

    delete element.dataset.wait;

    if (element.isConnected) mountPlayer(element);
    else continue;

    // Without video.js the `<video>`'s own native bar is kept.
    if (!player) delete element.dataset.loading;
  }
}

/** Releases the players before emptying the list. */
function unmountPlayers(scope) {
  /* The audio first, and it has to be here. `dispose()` only reaches video.js, and an
     `<audio>` that is playing is not stopped by being taken out of the DOM: it keeps
     its buffer and goes on playing with nothing on screen showing it. So "Clear
     results", the red cross and Esc all left the sound running. */
  for (const audio of scope.querySelectorAll(".media--audio audio")) {
    try {
      audio.pause();
    } catch {}
  }

  if (!window.videojs) return;

  for (const element of scope.querySelectorAll("video[data-player='videojs']")) {
    if (element.dataset.mounted !== "true") continue;

    try {
      window.videojs.getPlayer(element)?.dispose();
    } catch {}
  }
}

/**
 * If a file does not load, it is retried once through the server's proxy.
 *
 * The API always sends `media` as the direct address, and separately `proxy` for
 * the three cases in which the direct one does not work on its own: the CDN
 * demanding a `Referer`, it being HLS —which are loose segments the browser
 * cannot ask for one by one— or the item not even having been measured, in which
 * case `media` arrives as `null`.
 *
 * Nobody was reading that field. The preview stuck with the direct one and, when
 * it failed, only put up a notice. With this the direct one is still first —which
 * is what makes most of them not need to come through here— and the proxy is the
 * second attempt, once only: if that does not work either there is no third
 * attempt and it is said calmly.
 */
function reportMissing(element, item) {
  element.addEventListener("error", () => {
    if (element.dataset.gone === "1") return;

    if (element.dataset.retried !== "1" && item?.proxy) {
      element.dataset.retried = "1";
      element.src = item.proxy;
      return;
    }

    element.dataset.gone = "1";
    setStatus("the file won't load from this network: use Download", "error");
  });
}

/**
 * Where an item is loaded from: the direct one if there is one, otherwise the
 * proxy.
 *
 * The `null` in `media` —a YouTube item that was not measured— is not a mistake
 * by whoever painted it: the item is valid and has its proxy, so that one is
 * used. Before this, `null` was given to a `<video>` and what came out was a
 * broken player without saying anything.
 */
function fuenteDe(item) {
  return item.media || item.proxy || null;
}

/** Very large files: the server moves them in the background. */
function saveInBackground(url) {
  const frame = document.createElement("iframe");

  frame.hidden = true;
  frame.src = url;
  document.body.append(frame);
  setTimeout(() => frame.remove(), 60000);
}

/**
 * Downloads a file without ever opening links:
 *  1. direct from the CDN when the browser's network allows it,
 *  2. the server's proxy, also via fetch so the error can be shown in the
 *     interface instead of navigating to a JSON.
 */
async function download(item, sourceUrl, button) {
  const label = button.querySelector("span") ?? button;
  const before = label.textContent;
  const proxy = `/api/download?${new URLSearchParams({ url: sourceUrl, index: String(item.index) })}`;

  button.disabled = true;
  label.textContent = "Fetching…";

  try {
    const direct = await fetch(item.media, { mode: "cors" });

    /* The size is read BEFORE the body, on both branches.
       It used to be read only on the proxy branch, which runs second: the direct
       fetch is what works for most CDNs, so the 250 MB rule was enforced exactly
       where it was least likely to be needed, and `await direct.blob()` pulled
       the whole file into the tab with no ceiling and no way out. A 2 GB rip
       killed the tab, and `saveInBackground` was unreachable from that path. */
    if (direct.ok) {
      const declared = Number(direct.headers.get("content-length") ?? 0);

      if (declared > BLOB_LIMIT) {
        saveInBackground(proxy);
        label.textContent = "in progress";
        setStatus("downloading in the background", "busy");
        setTimeout(() => { label.textContent = before; }, 2500);
        return;
      }

      saveBlob(await direct.blob(), item.name);
      reportDone(label, before);
      return;
    }
  } catch {}

  try {
    const response = await fetch(proxy);

    if (!response.ok) {
      const payload = await response.json().catch(() => null);
      throw new Error(payload?.error ?? `Error ${response.status}`);
    }

    const size = Number(response.headers.get("content-length") ?? 0);

    if (size > BLOB_LIMIT) {
      saveInBackground(proxy);
      label.textContent = "in progress";
      setStatus("downloading in the background", "busy");
      setTimeout(() => { label.textContent = before; }, 2500);
      return;
    }

    saveBlob(await response.blob(), item.name);
    reportDone(label, before);
  } catch (error) {
    const message = humanize(error.message, lastResult.platform);

    label.textContent = before;
    setStatus(message, "error");
  } finally {
    button.disabled = false;
  }
}

function reportDone(label, before) {
  label.textContent = "ready";
  setStatus("downloaded", "ok");
  setTimeout(() => { label.textContent = before; }, 1800);
}

/** Downloads every item one after the other; the browser asks permission on the second. */
async function downloadAll() {
  const { items, url } = lastResult;

  if (!items.length) return;

  allBtn.disabled = true;
  submit.disabled = true;

  for (const [position, item] of items.entries()) {
    allLbl.textContent = `${position + 1}/${items.length}`;
    await download(item, url, allBtn);
    await new Promise((resolve) => setTimeout(resolve, 600));
  }

  allLbl.textContent = "Download all";
  allBtn.disabled = false;
  submit.disabled = false;
}

allBtn.addEventListener("click", downloadAll);

function showAll(count) {
  const visible = count > 1;

  allBtn.hidden = !visible;

  if (visible) allLbl.textContent = `Download all (${count})`;

  const brand = lastResult.platform ? (BRAND[lastResult.platform] ?? lastResult.platform) : "Results";

  setWindow(count > 0 ? brand : "Results", count > 0 ? String(count) : "");
}

/* --------------------------------------------------------------- actions -- */
/**
 * Whether a query is in flight.
 *
 * It is kept apart from `submit.disabled` because a `requestSubmit()` on a
 * disabled button still fires the `submit` event: the `disabled` attribute only
 * stops a person from pressing it. Without this flag, pasting twice in a row
 * would fire two queries.
 */
let resolviendo = false;

function busy(on) {
  submit.disabled = on;
  submit.setAttribute("aria-busy", String(on));
  submitLbl.textContent = "Download";

  const spinner = submit.querySelector(".spinner");

  if (on && !spinner) {
    submit.prepend(Object.assign(document.createElement("span"), { className: "spinner" }));
  }
  if (!on && spinner) spinner.remove();
}

async function resolve(url) {
  if (resolviendo) return;

  resolviendo = true;
  unmountPlayers(results);
  results.replaceChildren();
  busy(true);
  showAll(0);
  setState("loading");
  setWindow("Results");
  setStatus("");

  lastResult.url = null;
  lastResult.items = [];
  lastResult.platform = null;

  try {
    const response = await fetch(`/api/resolve?url=${encodeURIComponent(url)}`);
    const data = await response.json();

    /* A 4xx is a link that is no good, and the server says why with a message
       written for that. Passing it through `humanize` threw it into the catch-all
       and everything came out as «that link couldn't be read», which helps nobody.
       It is flagged so the `catch` below shows it literally. */
    if (!response.ok) {
      throw Object.assign(new Error(data.error || "no response"), { alreadyTranslated: true });
    }

    const resolved = data.platform;

    tint(resolved);

    const cards = data.items.map((item, index) => {
      const card = buildCard(item, url, resolved);
      card.style.animationDelay = `${Math.min(index, 7) * 40}ms`;
      return card;
    });

    results.append(...cards);
    mountPlayers(results);

    const count = data.items.length;
    field.dataset.filled = "true";

    setState(count > 0 ? "results" : "idle");
    lastResult.url = url;
    lastResult.items = data.items;
    lastResult.platform = resolved;
    showAll(count);

    /* `warning` arrives when the link carried a playlist and a video and the
       playlist could not be read. The items are the video's, which is what was
       asked for, but staying quiet about the failure would leave someone thinking
       the whole playlist came out wrong. It goes without `error` on purpose: the
       result is good, only a part is missing. */
    setStatus(data.warning ? `could not read the list — ${data.warning}` : "");
  } catch (error) {
    console.warn("resolve:", error);
    unmountPlayers(results);
    results.replaceChildren();
    setState("idle");
    setStatus(
      error?.alreadyTranslated ? error.message : humanize(error.message, lastResult.platform),
      "error",
    );
  } finally {
    resolviendo = false;
    busy(false);
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const url = input.value.trim();

  if (!url) {
    field.dataset.invalid = "true";
    setStatus("the link is missing", "error");
    input.focus();
    return;
  }

  // Nothing is validated here: the backend decides whether it recognises it.
  resolve(url);
});

input.addEventListener("input", sync);

/**
 * Pasting now sends on its own, without touching Download.
 *
 * Pasting is an atomic gesture: the whole URL appears at once and there is no way
 * to fire it half-typed, so no typing wait is needed at all.
 *
 * With the keyboard, Enter is still needed, and on purpose. A half-typed URL
 * already looks like a valid one —`https://www.w3` matches the pattern— and every
 * query would spend requests from the free plan to end the response with an
 * error. It waits until typing is done, which is exactly what Enter means.
 *
 * It only fires if what was pasted looks like a link. Pasting any text —a
 * sentence, a code snippet— leaves the field full but fires nothing.
 */
const LOOKS_LIKE_LINK = /^https?:\/\/[^\s/]+/i;

input.addEventListener("paste", () => {
  // The default paste is applied after the event, so the value is not there yet.
  // A `setTimeout` of 0 lets it land.
  setTimeout(() => {
    sync();

    const pegado = input.value.trim();

    if (resolviendo || submit.disabled) return;
    if (LOOKS_LIKE_LINK.test(pegado)) form.requestSubmit();
  }, 0);
});

for (const type of ["dragover", "drop"]) {
  field.addEventListener(type, (event) => {
    event.preventDefault();
    field.dataset.drop = "true";

    if (type === "drop") {
      const text = event.dataTransfer?.getData("text/plain")?.trim() ?? "";

      if (text) {
        input.value = text;
        sync();
      }
    }
  });
}

field.addEventListener("dragleave", () => { field.dataset.drop = "false"; });
field.addEventListener("dragend", () => { field.dataset.drop = "false"; });

input.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeWindow();
  }
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) form.requestSubmit();
});

clearBtn.addEventListener("click", reset);

pasteBtn.addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (text) input.value = text;
  } catch {
    input.focus();
    return;
  }

  sync();
});

/* ----------------------------------------------------------- item view -- */
/** List (the default) or horizontal carousel. */
/** How long it waits for the view change to finish before it can be repeated. */
const CAMBIO_VISTA_MS = 260;

let cambioVista = null;

function setView(mode) {
  if (!layout) return;

  const carousel = mode === "carousel";
  const actual = layout.dataset.view === "carousel" ? "carousel" : "list";

  /* Changing view changes each item's `grid`, and a `grid` cannot be
     interpolated: the items move all at once. What can be done is to cover the
     jump with a short fade, so that the jump happens while it cannot be seen. */
  if (actual !== mode && !cambioVista) {
    cambioVista = setTimeout(() => { cambioVista = null; }, CAMBIO_VISTA_MS);

    layout.dataset.swap = "";

    void layout.offsetWidth;

    delete layout.dataset.swap;
  }

  layout.dataset.view = carousel ? "carousel" : "list";

  if (viewList) {
    viewList.classList.toggle("is-on", !carousel);
    viewList.setAttribute("aria-pressed", String(!carousel));
  }

  if (viewSlide) {
    viewSlide.classList.toggle("is-on", carousel);
    viewSlide.setAttribute("aria-pressed", String(carousel));
  }

  if (carousel) results?.scrollTo?.({ left: 0, behavior: "auto" });
}

viewList?.addEventListener("click", () => setView("list"));
viewSlide?.addEventListener("click", () => setView("carousel"));

/**
 * Goes to the next item or the previous one, like a Stories. On reaching the
 * limit it wraps around: from the last to the first and from the first to the
 * last.
 */
function step(direction) {
  if (!results) return;

  const cards = [...results.querySelectorAll(".post")];

  if (!cards.length) return;

  const left = results.scrollLeft;
  const tolerance = 8;
  let actual = cards.findIndex((card) => card.offsetLeft - results.offsetLeft + card.offsetWidth > left + tolerance);

  if (actual === -1) actual = cards.length - 1;

  const destino = (actual + direction + cards.length) % cards.length;
  const top = cards[destino].offsetLeft - results.offsetLeft;

  results.scrollTo({ left: Math.max(0, top), behavior: "smooth" });
}

viewPrev?.addEventListener("click", () => step(-1));
viewNext?.addEventListener("click", () => step(1));

/* The loop with the finger too. On a touchscreen there are no arrows, so without
   this at the end of the carousel there would be no going back to the first item:
   the gesture had nowhere left to continue. When the scroll stops stuck to an
   edge, it jumps to the other one all at once. */
let hop = 0;
let withFinger = false;

results?.addEventListener("touchstart", () => { withFinger = true; }, { passive: true });

results?.addEventListener("scroll", () => {
  clearTimeout(hop);

  // Only if the movement comes from the finger. With the arrows it must not
  // happen: on reaching the last item, the jump would take it back to the first
  // and it would be unreachable on desktop.
  if (!withFinger) return;

  hop = setTimeout(() => {
    withFinger = false;

    // In list view the list is not a horizontal carousel and there is nothing to
    // do: the scroll is the usual one.
    if (layout?.dataset.view !== "carousel") return;

    const max = results.scrollWidth - results.clientWidth;
    const x = results.scrollLeft;

    if (max <= 2) return;

    if (x >= max - 2) results.scrollTo({ left: 0, behavior: "auto" });
    else if (x <= 2) results.scrollTo({ left: max, behavior: "auto" });
  }, 150);
}, { passive: true });

/* The list is the default view. Before it said `setView("carousel")`, and that
   was what made the HTML have to lie in its `data-view`: this startup stomped it
   as soon as the page booted. With the list in front, the HTML's attribute, the
   state of the buttons and this call all say the same thing, which is what keeps
   them from drifting apart. */
setView("list");

/* ------------------------------------------------------ closing the window -- */
winClose?.addEventListener("click", () => { reset(); input.focus(); });

/* --------------------------------------------------------- back to top -- */
if (toTop) {
  const syncToTop = () => toTop.classList.toggle("is-on", window.scrollY > 420);

  window.addEventListener("scroll", syncToTop, { passive: true });
  window.addEventListener("resize", syncToTop, { passive: true });

  toTop.addEventListener("click", () => {
    const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    window.scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });
    input.focus({ preventScroll: true });
    syncToTop();
  });

  syncToTop();
}

/* desktop shortcuts */
const apple = /mac|iphone|ipad/i.test(navigator.platform || navigator.userAgent);

for (const key of document.querySelectorAll("kbd[data-mod]")) {
  key.textContent = apple ? "⌘" : "Ctrl";
}

const typing = (node) => node && (node.tagName === "INPUT" || node.tagName === "TEXTAREA" || node.isContentEditable);

document.addEventListener("keydown", (event) => {
  if (event.key === "/" && !typing(event.target)) {
    event.preventDefault();
    input.focus();
    return;
  }

  // The arrows move between items, but only with the focus outside a field:
  // otherwise they would move the text cursor and not the carousel.
  if (!typing(event.target) && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
    if (layout?.dataset.state === "results") {
      event.preventDefault();
      step(event.key === "ArrowRight" ? 1 : -1);
    }
    return;
  }

  if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === "l") {
    event.preventDefault();
    toggleTheme();
  }
});

/* ripple on coarse pointers */
if (matchMedia("(pointer: coarse)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
  document.querySelectorAll(".primary, .paste").forEach((node) => {
    node.addEventListener("pointerdown", (event) => {
      const box = node.getBoundingClientRect();
      const size = Math.hypot(box.width, box.height) * 2;
      const drop = Object.assign(document.createElement("span"), { className: "ripple" });

      drop.style.width = drop.style.height = `${size}px`;
      drop.style.left = `${event.clientX - box.left - size / 2}px`;
      drop.style.top = `${event.clientY - box.top - size / 2}px`;
      node.append(drop);
      drop.addEventListener("animationend", () => drop.remove());
    });
  });
}

/* ----------------------------------------------------------- install button -- */

/* Installing is the browser's decision, not the page's. `beforeinstallprompt` is
   the only way it will ever offer, and `prompt()` on it only works from a real
   click — so the event has to be caught and held, and asked for later.
 *
 * The part that matters is what happens when it never arrives. Firefox does not
 * fire it, Safari does not fire it, and Chrome will not fire it for a page the
 * browser judges not to be installable yet. In all three the button would be a
   decoration, so instead of showing one that quietly does nothing it says how to
 * install by hand, per browser, because "it did nothing" is the least useful
 * thing a page can say about why it is not installing itself.
 */
(function instalar() {
  const boton = document.getElementById("installButton");

  if (!boton) return;

  /* Already running as the installed app. `display-mode: standalone` is what the
     manifest asked for, and matching it means the button has done its job. */
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
    boton.remove();
    return;
  }

  let evento = null;

  addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    evento = e;
    boton.hidden = false;
  });

  /* Fires whether or not the person chose to accept. The button has to go either
     way: leaving it up after a successful install offers to install what is
     already installed. */
  addEventListener("appinstalled", () => {
    boton.remove();
    evento = null;
  });

  boton.addEventListener("click", async () => {
    if (!evento) {
      explicarComoInstalar(boton);
      return;
    }

    boton.disabled = true;

    let aceptado = false;

    try {
      await evento.prompt();

      /* The choice is not visible from here. `userChoice` is the only report.
         A refusal has to take the button down, because the browser remembers it
         and asking again on every click is nagging rather than offering.
         Acceptance takes it down too, without waiting for `appinstalled`: that
         event is the confirmation, but leaving the button up in case it never
         arrives means offering to install what is already installed. */
      const elegido = await evento.userChoice;
      aceptado = elegido?.outcome === "accepted";

      /* A refusal has to clear the event as well as remove the button. Left set,
         the next click would call `prompt()` again on a prompt the browser has
         already refused, and the person gets asked the same thing every time. */
      if (!aceptado) evento = null;
    } catch {
      /* `prompt()` without a user activation throws. Swallowed here so it does not
         become an unhandled rejection nobody reads; the button comes back so the
         next click can try again. */
      boton.disabled = false;
      return;
    }

    boton.disabled = false;

    if (aceptado || !evento) boton.remove();
  });
})();

/** How to install by hand, for the browsers that will not fire the event. */
function explicarComoInstalar(boton) {
  const ua = navigator.userAgent;
  const texto = /Edg\//.test(ua) ? "Apps → Install this site as an app"
    : /CriOS|Chrome/.test(ua) && !/Edg/.test(ua) ? "the install icon in the address bar"
    : /Firefox/.test(ua) ? "the install icon in the address bar"
    : /iPhone|iPad/.test(ua) ? "Share → Add to Home Screen"
    : "the install icon in the address bar";

  /* `.theme-word`, not `.word`: that is the class the bar's other button labels
     use. This lookup is left in place so a future label swap cannot silently
     detach the tooltip from the element it describes. */
  const previo = boton.querySelector(".theme-word");

  if (previo && !previo.dataset.orig) previo.dataset.orig = previo.textContent;

  boton.title = `Open the browser menu and choose: ${texto}.`;
  boton.setAttribute("aria-label", `How to install: ${texto}`);
}

/* ---------------------------------------------------------------- startup -- */
root.dataset.boot = "";
requestAnimationFrame(() => requestAnimationFrame(() => { delete root.dataset.boot; }));

tint(null);
</script>
</body>
</html>
